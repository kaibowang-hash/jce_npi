version: '1.2'
product: NPI One
rules:
  one_active_task_per_pr: true
  m0_no_feature_code: true
  no_erpnext_core_patch: true
  no_cross_database_access: true
  no_dual_master_fields: true
  no_fake_success: true
  task_requires_acceptance_and_tests: true
  siemens_visual_baseline_required: true
  max_default_radius_px: 2
  single_primary_palette: true
  english_source_language: true
  mixed_ui_language_forbidden: true
  frappe_i18n_required: true
milestones:
- id: M0
  name: Discovery and decisions
  exit_gate: Approved repository facts, ADRs, ownership draft and M1 plan
  tasks:
  - id: M0-01
    title: Repository and runtime discovery
    skills:
    - repo-discovery
    outputs:
    - repo-map
    - runbook
    - test-ci-map
    - evidence-index
    code_allowed: false
  - id: M0-02
    title: ERPNext customization and API inventory
    skills:
    - repo-discovery
    - frappe-safe-change
    - erpnext-integration
    outputs:
    - doctype-inventory
    - hook-api-inventory
    - permission-map
    - file-strategy-facts
    code_allowed: false
  - id: M0-03
    title: Current-to-target architecture gap
    skills:
    - repo-discovery
    - npi-domain-guard
    outputs:
    - context-diagram
    - container-diagram
    - data-flows
    - gap-register
    code_allowed: false
  - id: M0-04
    title: ADR package and ownership decision draft
    skills:
    - npi-domain-guard
    - erpnext-integration
    outputs:
    - adr-001-through-010
    - ownership-delta
    - visual-baseline-decision
    - i18n-format-decision
    - decision-log
    code_allowed: false
  - id: M0-05
    title: M1 executable task decomposition
    skills:
    - industrial-ux
    - release-gate
    - frappe-i18n
    outputs:
    - m1-tasks
    - test-plan
    - sample-data-plan
    - risk-register
    code_allowed: false
