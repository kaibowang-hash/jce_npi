name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {contents: read}
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --strict-allow-scripts
        working-directory: frontend
      - run: bash scripts/verify-dev-config.sh
      - run: bash scripts/verify.sh
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run test:visual
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-4-frontend-evidence
          path: implementation/evidence/phase-4
          if-no-files-found: warn
      - uses: gitleaks/gitleaks-action@v2
