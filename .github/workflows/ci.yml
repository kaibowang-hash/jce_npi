name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      gate_mode:
        description: Complete Level 3 Gate or exact-SHA Level 2 controlled reuse
        required: true
        default: level_3
        type: choice
        options:
          - level_3
          - level_2_controlled
      ordinary_run_id:
        description: Required successful pull-request run ID for level_2_controlled
        required: false
        type: string

concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: { actions: read, contents: read }
jobs:
  repository:
    if: github.event_name != 'workflow_dispatch' || inputs.gate_mode == 'level_3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install required repository verification tools when absent
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
      - run: bash scripts/verify.sh --repository
        env:
          GITHUB_TOKEN: ${{ github.token }}

  frontend:
    if: github.event_name != 'workflow_dispatch' || inputs.gate_mode == 'level_3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --strict-allow-scripts
        working-directory: frontend
      - run: bash scripts/verify.sh --frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  secret_scan:
    if: github.event_name != 'workflow_dispatch' || inputs.gate_mode == 'level_3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: python scripts/verify_current_task.py
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.24.3
      - name: Scan complete pull-request branch history
        if: github.event_name == 'pull_request'
        run: >-
          /tmp/gitleaks-8.24.3/gitleaks detect
          --redact
          --verbose
          --exit-code=2
          --log-opts="--no-merges origin/main..HEAD"

  visual:
    if: github.event_name != 'workflow_dispatch' || inputs.gate_mode == 'level_3'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm@sha256:b726eb94f42fcddb10056835f2c474c9f9e12e717ba2b2d2f9a8b1d78feeb68b
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --strict-allow-scripts
        working-directory: frontend
      - name: Sanitize canonical visual package sources
        run: |
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '/dl\.yarnpkg\.com\/debian/d' /etc/apt/sources.list
          fi
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*yarn*' -delete
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify R1-06 governed visual matrix
        run: >-
          npx playwright test
          tests/e2e/r1-06-p0-visual-governance.spec.ts
          tests/e2e/r1-05-panes.spec.ts
          tests/e2e/r1-05-field-attachments.spec.ts
          tests/e2e/p5-01-documents-live.spec.ts
          tests/e2e/p5-04-ebom-live.spec.ts
          tests/e2e/p5-05-publish-request-live.spec.ts
          tests/e2e/p5-06-controlled-print-live.spec.ts
          tests/e2e/p6-01-tooling-live.spec.ts
          tests/e2e/p6-02-tooling-set-live.spec.ts
          tests/e2e/p6-03-tooling-revision-live.spec.ts
          tests/e2e/p6-07-tooling-import-live.spec.ts
          tests/e2e/p6-08-tooling-list-live.spec.ts
          tests/e2e/p7-01-trial-planning-live.spec.ts
          tests/e2e/p7-02-trial-execution-live.spec.ts
          tests/e2e/p7-03-trial-quality-live.spec.ts
          tests/e2e/p7-04-trial-review-live.spec.ts
          tests/e2e/p7-05-readiness-live.spec.ts
          tests/e2e/gate-evidence-live.spec.ts
          --grep @visual
        env:
          NPI_EVIDENCE_SCOPE: phase-5/r1-06-stage-3
        working-directory: frontend
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: r1-06-linux-visual-evidence
          path: |
            frontend/tests/e2e/r1-06-p0-visual-governance.spec.ts-snapshots/r1-06-p0-normal-*-linux.png
            frontend/tests/e2e/p5-01-documents-live.spec.ts-snapshots/p5-0*-linux.png
            frontend/tests/e2e/p5-04-ebom-live.spec.ts-snapshots/p5-04-*-linux.png
            frontend/tests/e2e/p5-05-publish-request-live.spec.ts-snapshots/p5-05-*-linux.png
            frontend/tests/e2e/p5-06-controlled-print-live.spec.ts-snapshots/p5-06-*-linux.png
            frontend/tests/e2e/p6-01-tooling-live.spec.ts-snapshots/p6-01-*-linux.png
            frontend/tests/e2e/p6-02-tooling-set-live.spec.ts-snapshots/p6-02-*-linux.png
            frontend/tests/e2e/p6-03-tooling-revision-live.spec.ts-snapshots/p6-03-*-linux.png
            frontend/tests/e2e/p6-03-tooling-revision-live.spec.ts-snapshots/p6-04-*-linux.png
            frontend/tests/e2e/p6-03-tooling-revision-live.spec.ts-snapshots/p6-05-*-linux.png
            frontend/tests/e2e/p6-03-tooling-revision-live.spec.ts-snapshots/p6-06-*-linux.png
            frontend/tests/e2e/p6-07-tooling-import-live.spec.ts-snapshots/p6-07-*-linux.png
            frontend/tests/e2e/p6-08-tooling-list-live.spec.ts-snapshots/p6-08-*-linux.png
            frontend/tests/e2e/p7-01-trial-planning-live.spec.ts-snapshots/p7-01-*-linux.png
            frontend/tests/e2e/p7-02-trial-execution-live.spec.ts-snapshots/p7-02-*-linux.png
            frontend/tests/e2e/p7-03-trial-quality-live.spec.ts-snapshots/p7-03-*-linux.png
            frontend/tests/e2e/p7-04-trial-review-live.spec.ts-snapshots/p7-04-*-linux.png
            frontend/tests/e2e/p7-05-readiness-live.spec.ts-snapshots/p7-05-*-linux.png
            frontend/tests/e2e/gate-evidence-live.spec.ts-snapshots/p5-03-*-linux.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-report/**
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/.last-run.json
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/r1-06-*/**/*-actual.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/r1-06-*/**/*-diff.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/r1-05-*/**/*-actual.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/r1-05-*/**/*-diff.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p5-0*/**/*-actual.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p5-0*/**/*-diff.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p6-01-tooling-live-*/**/*-actual.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p6-01-tooling-live-*/**/*-diff.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p6-02-tooling-set-live-*/**/*-actual.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p6-02-tooling-set-live-*/**/*-diff.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p6-03-tooling-revision-liv-*/**/*-actual.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p6-03-tooling-revision-liv-*/**/*-diff.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p6-07-tooling-import-live-*/**/*-actual.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p6-07-tooling-import-live-*/**/*-diff.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p6-08-tooling-list-live-*/**/*-actual.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p6-08-tooling-list-live-*/**/*-diff.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p7-01-trial-planning-live-*/**/*-actual.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p7-01-trial-planning-live-*/**/*-diff.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p7-02-trial-execution-live-*/**/*-actual.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p7-02-trial-execution-live-*/**/*-diff.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p7-03-trial-quality-live-*/**/*-actual.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p7-03-trial-quality-live-*/**/*-diff.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p7-04-trial-review-live-*/**/*-actual.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p7-04-trial-review-live-*/**/*-diff.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p7-05-readiness-live-*/**/*-actual.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/p7-05-readiness-live-*/**/*-diff.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/gate-evidence-live--visual-*/**/*-actual.png
            implementation/evidence/phase-5/r1-06-stage-3/playwright-results/gate-evidence-live--visual-*/**/*-diff.png
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  controlled_preflight:
    # Preserved P7-03 predecessor evidence: python -m unittest tests.test_phase7_trial_runtime_verifier tests.test_phase7_trial_quality_runtime_verifier -v
    # Preserved P7-04 predecessor evidence: python -m unittest tests.test_phase7_trial_runtime_verifier tests.test_phase7_trial_quality_runtime_verifier tests.test_phase7_trial_review_runtime_verifier -v
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Verify current task and runtime contract before Site setup
        run: |
          python scripts/verify_current_task.py
          python -m unittest tests.test_phase7_trial_runtime_verifier tests.test_phase7_trial_quality_runtime_verifier tests.test_phase7_trial_review_runtime_verifier tests.test_phase7_readiness_runtime_verifier -v
          bash -n scripts/verify-frappe-runtime.sh
      - name: Verify exact prior pull-request Gate for Level 2 reuse
        if: inputs.gate_mode == 'level_2_controlled'
        run: >-
          python scripts/verify_prior_gate.py
          --repository "${{ github.repository }}"
          --run-id "${{ inputs.ordinary_run_id }}"
          --sha "${{ github.sha }}"
          --output "${RUNNER_TEMP}/prior-gate/attestation.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v6
        if: inputs.gate_mode == 'level_2_controlled'
        with:
          name: prior-gate-attestation-${{ github.run_id }}
          path: ${{ runner.temp }}/prior-gate/attestation.json
          if-no-files-found: error
          retention-days: 30

  document_runtime:
    # Preserved predecessor scope: P7-03 Trial quality
    # Verify cumulative P5 and P6-08 controlled runtime plus P7-01 through P7-03 Trial quality
    # scope=p5-01-through-p7-03
    # predecessor_scope=p5-01-through-p7-02
    # Preserved predecessor scope: P7-04 Trial review
    # Verify cumulative P5 and P6-08 controlled runtime plus P7-01 through P7-04 Trial review
    # scope=p5-01-through-p7-04
    # predecessor_scope=p5-01-through-p7-03
    name: P5 controlled document runtime and P6 Tooling through export plus P7-05 NPI readiness
    needs:
      - repository
      - frontend
      - secret_scan
      - visual
      - controlled_preflight
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      !cancelled() &&
      needs.controlled_preflight.result == 'success' &&
      ((inputs.gate_mode == 'level_3' &&
      needs.repository.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.secret_scan.result == 'success' &&
      needs.visual.result == 'success') ||
      (inputs.gate_mode == 'level_2_controlled' &&
      needs.repository.result == 'skipped' &&
      needs.frontend.result == 'skipped' &&
      needs.secret_scan.result == 'skipped' &&
      needs.visual.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v6
        with: { node-version: "24.18.0" }
      - name: Install and verify exact Bench runtime tools
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            "frappe-bench==5.31.0" \
            "uv==0.11.30"
          python -c 'from importlib.metadata import version; raise SystemExit(0 if (version("frappe-bench"), version("uv")) == ("5.31.0", "0.11.30") else 1)'
          test "$(yarn --version)" = "1.22.22"
      - name: Initialize pinned Frappe Bench
        run: bash scripts/init-frappe-bench.sh
      - name: Initialize fixed disposable NPI Site
        run: bash scripts/init-npi-site.sh
      - name: Verify cumulative P5 and P6-08 controlled runtime plus P7-01 through P7-05 NPI readiness
        run: bash scripts/verify-frappe-runtime.sh --trial-only
      - name: Record controlled runtime result
        run: |
          mkdir -p "${RUNNER_TEMP}/p7-trial-runtime"
          {
            printf 'result=PASS\n'
            printf 'head_sha=%s\n' "${GITHUB_SHA}"
            printf 'run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'gate_mode=%s\n' "${{ inputs.gate_mode }}"
            printf 'site=npi.localhost\n'
            printf 'database=npi_one_runtime\n'
            printf 'runtime_marker=npi-one-local-runtime-disposable-v1\n'
            printf 'scope=p5-01-through-p7-05\n'
            printf 'predecessor_scope=p5-01-through-p7-04\n'
            printf 'p6_scope=p5-01-through-p6-08\n'
            printf 'p6_predecessor_scope=p5-01-through-p6-07\n'
            printf 'frappe_commit=a3d8090ba80cb91d3ed72ea90bec67df201db5c1\n'
            printf 'command=bash scripts/verify-frappe-runtime.sh --trial-only\n'
            printf 'predecessor_command=bash scripts/verify-frappe-runtime.sh --tooling-only\n'
            printf 'p5_predecessor_command=bash scripts/verify-frappe-runtime.sh --document-only\n'
            printf 'predecessor_artifact=p6-tooling-runtime-${{ github.run_id }}\n'
          } >"${RUNNER_TEMP}/p7-trial-runtime/result.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: p7-trial-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/p7-trial-runtime/result.txt
          if-no-files-found: error
          retention-days: 30
      - name: Clean ephemeral runtime resources
        if: always()
        run: docker compose down --volumes
