services:
  mariadb:
    image: mariadb:10.6@sha256:114d40be36852d0a019afd8458f7e1cc63fd300403b115b1f32e31130d5f671b
    environment: {MARIADB_ROOT_PASSWORD: dev-only-root}
    ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["npi_mariadb:/var/lib/mysql"]
  redis:
    image: redis:7.2-alpine@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["npi_redis:/data"]
volumes: {npi_mariadb: {}, npi_redis: {}}
