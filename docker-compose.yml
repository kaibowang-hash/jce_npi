services:
  workspace:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    command: sleep infinity
    volumes: [".:/workspace:cached"]
  mariadb:
    image: mariadb:10.6
    environment: {MARIADB_ROOT_PASSWORD: dev-only-root}
    volumes: ["npi_mariadb:/var/lib/mysql"]
  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    volumes: ["npi_redis:/data"]
volumes: {npi_mariadb: {}, npi_redis: {}}
