[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npi-integration"
version = "0.1.0"
description = "NPI One reliable integration foundation"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["npi_integration*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt"]
