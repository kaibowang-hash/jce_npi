[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npi_erpnext_connector"
version = "0.7.0"
description = "Operation-specific ERPNext integration for LaunchFlow"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["npi_erpnext_connector*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "translations/*.csv"]
