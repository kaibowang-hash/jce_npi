[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npi-erpnext-connector"
version = "0.1.0"
description = "Operation-specific ERPNext sender for LaunchFlow"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["npi_erpnext_connector*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "translations/*.csv"]
