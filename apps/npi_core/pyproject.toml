[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npi-core"
version = "0.1.0"
description = "NPI One domain and security foundation"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["npi_core*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt"]
