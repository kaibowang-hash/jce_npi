version: "1.2"
principles:
  - one_field_one_owner
  - projections_are_read_only
  - formal_execution_in_erpnext
  - no_cross_database_access
  - conflicts_create_visible_exception
  - released_versions_are_immutable

identity:
  required:
    - global_id
    - source_system
    - source_object_type
    - source_object_id
    - version
  mapping_store_owner: NPI_ONE

objects:
  Customer:
    owner_system: ERPNEXT
    npi_view: projection
    key: erpnext_customer_id
    fields:
      name: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}
      customer_code: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}
      status: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}
      project_specific_contact_notes: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: NPI_ONLY}

  EngineeringProject:
    owner_system: NPI_ONE
    erp_view: summary_link
    fields:
      business_code: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NPI_TO_ERPNEXT_SUMMARY, conflict: OWNER_WINS}
      target_sop: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NPI_TO_ERPNEXT_SUMMARY, conflict: OWNER_WINS}
      gate_status: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NPI_TO_ERPNEXT_SUMMARY, conflict: OWNER_WINS}
      sales_order_id: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}

  ProjectTeam:
    owner_system: NPI_ONE
    erp_view: none
    fields:
      membership: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      project_roles: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      substitutions: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      raci_assignments: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      approval_authority: {owner: VERSIONED_APPROVAL_POLICY, editable_in: [], direction: NONE, conflict: FAIL_CLOSED}

  ProjectWorkPlan:
    owner_system: NPI_ONE
    erp_view: none
    fields:
      wbs_hierarchy: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      dependencies: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      planned_dates: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      actual_dates: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      progress: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      critical_task: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      plan_baseline: {owner: NPI_ONE, editable_in: [], direction: NONE, conflict: IMMUTABLE_SNAPSHOT}

  DomainWorkItem:
    owner_system: NPI_ONE
    erp_view: none
    fields:
      semantic_kind: {owner: NPI_ONE, editable_in: [], direction: NONE, conflict: IMMUTABLE_IDENTITY}
      lifecycle_policy: {owner: NPI_ONE, editable_in: [], direction: NONE, conflict: IMMUTABLE_SNAPSHOT}
      lifecycle_state: {owner: NPI_ONE, editable_in: [NPI_ONE_POLICY_ENGINE], direction: NONE, conflict: VERSION_CONFLICT}
      context_and_relations: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      owner_due_severity_blocking: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      evidence_references: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: EXACT_VERSION_REFERENCE}

  GateTemplate:
    owner_system: NPI_ONE
    erp_view: none
    fields:
      template_identity: {owner: NPI_ONE, editable_in: [NPI_ONE_ADMIN], direction: NONE, conflict: IMMUTABLE_IDENTITY}
      published_version: {owner: NPI_ONE, editable_in: [], direction: NONE, conflict: IMMUTABLE_SNAPSHOT}
      applicable_project_types: {owner: NPI_ONE, editable_in: [NPI_ONE_ADMIN_DRAFT], direction: NONE, conflict: NEW_TEMPLATE_VERSION}
      requirement_definitions: {owner: NPI_ONE, editable_in: [NPI_ONE_ADMIN_DRAFT], direction: NONE, conflict: NEW_TEMPLATE_VERSION}
      production_condition_policy: {owner: VERSIONED_GATE_POLICY, editable_in: [], direction: NONE, conflict: FAIL_CLOSED}

  GateInstance:
    owner_system: NPI_ONE
    erp_view: summary_link
    fields:
      gate_identity: {owner: NPI_ONE, editable_in: [], direction: NONE, conflict: IMMUTABLE_IDENTITY}
      gate_template_reference: {owner: NPI_ONE, editable_in: [], direction: NONE, conflict: EXACT_VERSION_REFERENCE}
      requirement_snapshot: {owner: NPI_ONE, editable_in: [], direction: NONE, conflict: IMMUTABLE_SNAPSHOT}
      explicit_owner_reviewer_dates: {owner: NPI_ONE, editable_in: [NPI_ONE_ADMIN_BEFORE_FREEZE], direction: NONE, conflict: FREEZE_ONCE}
      decision_state: {owner: VERSIONED_GATE_POLICY, editable_in: [], direction: NONE, conflict: FAIL_CLOSED}

  GateEvidenceReference:
    owner_system: NPI_ONE
    erp_view: none
    fields:
      gate_requirement_identity: {owner: NPI_ONE, editable_in: [], direction: NONE, conflict: IMMUTABLE_IDENTITY}
      evidence_source_identity: {owner: SOURCE_OBJECT_OWNER, editable_in: [], direction: REFERENCE_ONLY, conflict: EXACT_VERSION_REFERENCE}
      exact_version_hash_snapshot: {owner: NPI_ONE, editable_in: [], direction: NONE, conflict: IMMUTABLE_SNAPSHOT}
      attachment_audit: {owner: NPI_ONE, editable_in: [], direction: NONE, conflict: APPEND_ONLY}
      replacement_or_detach_policy: {owner: VERSIONED_GATE_POLICY, editable_in: [], direction: NONE, conflict: FAIL_CLOSED}

  FileRevision:
    owner_system: NPI_ONE
    erp_view: reference_only
    fields:
      project_document_revision_identity: {owner: NPI_ONE, editable_in: [], direction: NONE, conflict: IMMUTABLE_IDENTITY}
      private_file_identity_and_metadata: {owner: NPI_ONE_FILE_SERVICE, editable_in: [], direction: NONE, conflict: IMMUTABLE_SNAPSHOT}
      sha256: {owner: NPI_ONE_FILE_SERVICE, editable_in: [], direction: REFERENCE_ONLY, conflict: HASH_MISMATCH_EXCEPTION}
      scan_state: {owner: NPI_ONE_SCAN_SERVICE, editable_in: [NPI_ONE_SCAN_SERVICE], direction: NONE, conflict: VERSION_CONFLICT}
      raw_private_url: {owner: FRAPPE_FILE_SERVICE, editable_in: [], direction: NONE, conflict: NEVER_EXPOSE_AS_PROJECT_AUTHORIZATION}

  Item:
    owner_system: ERPNEXT_AFTER_RELEASE
    phases:
      engineering_draft:
        owner: NPI_ONE
        identifier: engineering_item_id
      formal:
        owner: ERPNEXT
        identifier: item_code
    fields:
      engineering_description: {owner: NPI_ONE_BEFORE_RELEASE, editable_in: [NPI_ONE], direction: NPI_TO_ERPNEXT_VIA_EXECUTION, conflict: LOCK_DURING_EXECUTION}
      item_code: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: IMMUTABLE_MAPPING}
      stock_uom: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}
      project_requirements: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: NPI_ONLY}

  EBOM_MBOM:
    owner_system: SPLIT_BY_STAGE
    fields:
      ebom_revision: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NPI_TO_ERPNEXT_VIA_EXECUTION, conflict: RELEASE_NEW_REVISION}
      mbom_id: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: IMMUTABLE_MAPPING}
      manufacturing_routing: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}
      conversion_notes: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: NPI_ONLY}

  Tooling:
    owner_system: SPLIT_BY_LIFECYCLE
    fields:
      development_state: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NPI_TO_ERPNEXT_SUMMARY, conflict: OWNER_WINS}
      specification_revision: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NPI_TO_ERPNEXT_VIA_EXECUTION, conflict: RELEASE_NEW_REVISION}
      design_revision: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: RELEASE_NEW_REVISION}
      trial_state: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: OWNER_WINS}
      asset_id: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: IMMUTABLE_MAPPING}
      asset_status: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}
      location: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}
      shot_count: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}
      maintenance: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}

  TrialRound:
    owner_system: NPI_ONE
    fields:
      locked_inputs: {owner: NPI_ONE, editable_in: [NPI_ONE_UNTIL_PREPARED], direction: NONE, conflict: NEW_ROUND_OR_REOPEN}
      process_parameters: {owner: NPI_ONE, editable_in: [NPI_ONE_UNTIL_SUBMITTED], direction: NPI_TO_ERPNEXT_VIA_RELEASE, conflict: NEW_REVISION}
      defects: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: OPTIONAL_NCR_REQUEST, conflict: OWNER_WINS}
      official_quality_result: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}

  EngineeringChange:
    owner_system: SPLIT
    fields:
      formal_change_number: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}
      approval_status: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}
      engineering_impact: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NPI_TO_ERPNEXT_SUMMARY, conflict: OWNER_WINS}
      validation_tasks: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: OWNER_WINS}

  QualityInspection:
    owner_system: ERPNEXT
    npi_view: projection_and_gate_evidence
    fields:
      inspection_id: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: IMMUTABLE_MAPPING}
      result: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}
      status: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}
      gate_interpretation: {owner: NPI_ONE, editable_in: [NPI_ONE_RULE_ENGINE], direction: NONE, conflict: RECOMPUTE}

  ControlledDocument:
    owner_system: SPLIT_BY_STAGE
    fields:
      working_revision: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: NEW_REVISION}
      baseline_membership: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NPI_TO_ERPNEXT_REFERENCE, conflict: IMMUTABLE_SNAPSHOT}
      official_archive_id: {owner: ERPNEXT_OR_DMS, editable_in: [ERPNEXT_OR_DMS], direction: EXTERNAL_TO_NPI, conflict: IMMUTABLE_MAPPING}
      file_hash: {owner: CREATOR_SYSTEM, editable_in: [], direction: BOTH_REFERENCE, conflict: HASH_MISMATCH_EXCEPTION}

exception_policy:
  create_object: IntegrationException
  required_fields:
    - global_id
    - object_type
    - field_path
    - expected_owner
    - npi_value_hash
    - erp_value_hash
    - detected_at
    - severity
    - assigned_to
    - status
