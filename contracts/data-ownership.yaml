version: "1.2"
principles:
  - one_field_one_owner
  - projections_are_read_only
  - formal_execution_in_erpnext
  - no_cross_database_access
  - conflicts_create_visible_exception
  - released_versions_are_immutable

identity:
  required:
    - global_id
    - source_system
    - source_object_type
    - source_object_id
    - version
  mapping_store_owner: NPI_ONE

objects:
  Customer:
    owner_system: ERPNEXT
    npi_view: projection
    key: erpnext_customer_id
    fields:
      name: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}
      customer_code: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}
      status: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}
      project_specific_contact_notes: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: NPI_ONLY}

  EngineeringProject:
    owner_system: NPI_ONE
    erp_view: summary_link
    fields:
      business_code: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NPI_TO_ERPNEXT_SUMMARY, conflict: OWNER_WINS}
      target_sop: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NPI_TO_ERPNEXT_SUMMARY, conflict: OWNER_WINS}
      gate_status: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NPI_TO_ERPNEXT_SUMMARY, conflict: OWNER_WINS}
      lifecycle_state: {owner: VERSIONED_PROJECT_CONTROL_POLICY, editable_in: [NPI_ONE_PROJECT_CONTROL_COMMAND], direction: NPI_TO_ERPNEXT_SUMMARY, conflict: VERSION_CONFLICT}
      control_policy_binding: {owner: NPI_ONE_RULE_ENGINE, editable_in: [NPI_ONE_PROJECT_CONTROL_COMMAND], direction: NONE, conflict: EXACT_VERSION_REFERENCE}
      current_health_summary: {owner: NPI_ONE_RULE_ENGINE, editable_in: [NPI_ONE_PROJECT_CONTROL_COMMAND], direction: NPI_TO_ERPNEXT_SUMMARY, conflict: VERSION_CONFLICT}
      sales_order_id: {owner: ERPNEXT, editable_in: [ERPNEXT], direction: ERPNEXT_TO_NPI, conflict: OWNER_WINS}

  ProjectTeam:
    owner_system: NPI_ONE
    erp_view: none
    fields:
      membership: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      project_roles: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      substitutions: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      raci_assignments: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      approval_authority: {owner: VERSIONED_APPROVAL_POLICY, editable_in: [], direction: NONE, conflict: FAIL_CLOSED}

  ProjectWorkPlan:
    owner_system: NPI_ONE
    erp_view: none
    fields:
      wbs_hierarchy: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      dependencies: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      planned_dates: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      actual_dates: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      progress: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
      critical_task: {owner: NPI_ONE, editable_in: [NPI_ONE], direction: NONE, conflict: VERSION_CONFLICT}
