      name: publishRequestId
      required: true
      description: Immutable operation-specific formal Item/MBOM publish-request global_id
      schema: { type: string, format: uuid }
    FileRevisionId:
      in: path
      name: fileRevisionId
      required: true
      description: Immutable exact private File Revision global_id
      schema: { type: string, format: uuid }
    ToolingId:
      in: path
      name: toolingId
      required: true
      schema: { type: string, format: uuid }
    TrialId:
      in: path
      name: trialId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 255
        pattern: "^[!-~]{16,255}$"
    RequestId:
      in: header
      name: X-Request-ID
      required: true
      description: Caller-generated UUID used for request, audit, and support correlation
      schema: { type: string, format: uuid }
    CsrfToken:
      in: header
      name: X-Frappe-CSRF-Token
      required: true
      description: Current Frappe session CSRF token returned by SessionBootstrap
      schema: { type: string, minLength: 32, maxLength: 128 }
  responses:
    Error:
      description: Problem response for an otherwise undocumented error status
      headers:
        X-Trace-ID:
          description: Stable trace identifier matching ProblemDetails traceId
          schema:
            {
              type: string,
              minLength: 8,
              maxLength: 128,
              pattern: "^[A-Za-z0-9._:-]+$",
            }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    BadRequest:
      description: The request syntax, headers, or JSON representation is malformed
      headers:
        X-Request-ID:
          description: Request identifier echoed for audit and support correlation
          required: true
          schema: { type: string, format: uuid }
        X-Trace-ID:
          description: Stable trace identifier matching ProblemDetails traceId
          required: true
