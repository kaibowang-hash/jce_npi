        replacementEffectiveDate: { type: [string, "null"], format: date }
        actorUserId: { type: string, minLength: 1, maxLength: 254 }
        occurredAt: { type: string, format: date-time }
        requestId: { type: string, format: uuid }
        traceId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]+$"
        eventHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
