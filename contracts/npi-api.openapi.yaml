openapi: 3.1.0
info:
  title: NPI One Domain API
  version: 1.2.0
  description: >
    Business-oriented API for the independent NPI One web application.
    Raw Frappe DocType CRUD is not the public browser contract.
servers:
  - url: /api/npi/v1
security:
  - sessionAuth: []
  - oauth2: [npi.user]
tags:
  - {name: Session}
  - {name: Work}
  - {name: Projects}
  - {name: Gates}
  - {name: Tooling}
  - {name: Trials}
  - {name: Execution}
paths:
  /session/bootstrap:
    get:
      tags: [Session]
      operationId: getSessionBootstrap
      responses:
        "200":
          description: Authenticated session language and filtered effective NPI catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBootstrap"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /session/language:
    put:
      tags: [Session]
      operationId: setSessionLanguage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSessionLanguage"
      responses:
        "200":
          description: Persisted language and refreshed effective NPI catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBootstrap"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /me/work:
    get:
      tags: [Work]
      operationId: getMyWork
      parameters:
        - in: query
          name: view
          schema: {type: string, enum: [today, overdue, approvals, blockers, waiting, integration]}
        - in: query
          name: cursor
          schema: {type: string}
      responses:
        "200":
          description: Unified work queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPage"
        default:
          $ref: "#/components/responses/Error"

  /projects/{projectId}/cockpit:
    get:
      tags: [Projects]
      operationId: getProjectCockpit
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Aggregated project object page view model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCockpit"
        default:
          $ref: "#/components/responses/Error"

  /projects/{projectId}/gates/{gateId}/review:
    get:
      tags: [Gates]
      operationId: getGateReview
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/GateId"
      responses:
        "200":
          description: Gate review room view model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateReview"
        default:
          $ref: "#/components/responses/Error"

  /projects/{projectId}/gates/{gateId}:decide:
    post:
      tags: [Gates]
      operationId: decideGate
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/GateId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, decision, evidenceSnapshotHash]
              properties:
                expectedVersion: {type: integer, minimum: 0}
                decision: {type: string, enum: [pass, conditional_pass, reject, reopen]}
                reason: {type: string, maxLength: 4000}
                evidenceSnapshotHash: {type: string, pattern: "^[a-fA-F0-9]{64}$"}
                waiverIds:
                  type: array
                  items: {type: string, format: uuid}
      responses:
        "200":
          description: Gate decision and immutable snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"

  /tooling/{toolingId}/cockpit:
    get:
      tags: [Tooling]
      operationId: getToolingCockpit
      parameters:
        - $ref: "#/components/parameters/ToolingId"
      responses:
        "200":
          description: Tooling lifecycle view model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolingCockpit"
        default:
          $ref: "#/components/responses/Error"

  /tooling/{toolingId}/trials:
    post:
      tags: [Trials]
      operationId: createTrialRound
      parameters:
        - $ref: "#/components/parameters/ToolingId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, plannedAt, lockedInputIds]
              properties:
                purpose: {type: string, maxLength: 500}
                plannedAt: {type: string, format: date-time}
                inheritFromTrialRoundId: {type: string, format: uuid}
                lockedInputIds:
                  type: array
                  minItems: 1
                  items: {type: string, format: uuid}
      responses:
        "201":
          description: Trial round created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        default:
          $ref: "#/components/responses/Error"

  /trials/{trialId}/workspace:
    get:
      tags: [Trials]
      operationId: getTrialWorkspace
      parameters:
        - $ref: "#/components/parameters/TrialId"
      responses:
        "200":
          description: Trial workspace view model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialWorkspace"
        default:
          $ref: "#/components/responses/Error"

  /trials/{trialId}:submit:
    post:
      tags: [Trials]
      operationId: submitTrialRound
      parameters:
        - $ref: "#/components/parameters/TrialId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, conclusion, inputSnapshotHash]
              properties:
                expectedVersion: {type: integer}
                conclusion:
                  type: string
                  enum: [pass, conditional_pass, tooling_change, design_change, process_tuning, material_change, cancelled]
                reason: {type: string, maxLength: 4000}
                inputSnapshotHash: {type: string, pattern: "^[a-fA-F0-9]{64}$"}
      responses:
        "202":
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"

  /execution-requests:
    post:
      tags: [Execution]
      operationId: createExecutionRequest
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExecutionRequest"
      responses:
        "202":
          description: ERP execution queued; not yet completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRequest"
        default:
          $ref: "#/components/responses/Error"

  /execution-requests/{requestId}:
    get:
      tags: [Execution]
      operationId: getExecutionRequest
      parameters:
        - in: path
          name: requestId
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Current execution truth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRequest"
        default:
          $ref: "#/components/responses/Error"

  /execution-requests/{requestId}:retry:
    post:
      tags: [Execution]
      operationId: retryExecutionRequest
      parameters:
        - in: path
          name: requestId
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Safe retry queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sid
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes:
            npi.user: Use NPI One
            npi.admin: Administer NPI One
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: {type: string, format: uuid}
    GateId:
      in: path
      name: gateId
      required: true
      schema: {type: string, format: uuid}
    ToolingId:
      in: path
      name: toolingId
      required: true
      schema: {type: string, format: uuid}
    TrialId:
      in: path
      name: trialId
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 16, maxLength: 255}
    CsrfToken:
      in: header
      name: X-Frappe-CSRF-Token
      required: true
      description: Current Frappe session CSRF token returned by SessionBootstrap
      schema: {type: string, minLength: 32, maxLength: 128}
  responses:
    Error:
      description: Error
      headers:
        X-Trace-ID:
          description: Stable trace identifier matching the Problem traceId
          schema: {type: string}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: Version or state conflict
      headers:
        X-Trace-ID:
          description: Stable trace identifier matching the Problem traceId
          schema: {type: string}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ValidationError:
      description: Business validation failed
      headers:
        X-Trace-ID:
          description: Stable trace identifier matching the Problem traceId
          schema: {type: string}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    LanguageCode:
      type: string
      enum: [en, zh, zh-TW]
    TranslationCatalog:
      type: object
      additionalProperties: false
      required: [language, version, messages]
      properties:
        language:
          $ref: "#/components/schemas/LanguageCode"
        version:
          type: string
          pattern: "^[a-f0-9]{64}$"
        messages:
          type: object
          description: Effective Frappe translations filtered to canonical NPI source/context keys
          additionalProperties:
            type: string
    SessionBootstrap:
      type: object
      additionalProperties: false
      required: [userId, language, allowedLanguages, csrfToken, catalog]
      properties:
        userId: {type: string}
        language:
          $ref: "#/components/schemas/LanguageCode"
        allowedLanguages:
          type: array
          minItems: 3
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/LanguageCode"
        csrfToken:
          type: string
          minLength: 32
          maxLength: 128
          description: Current token for X-Frappe-CSRF-Token on unsafe session requests
        catalog:
          $ref: "#/components/schemas/TranslationCatalog"
    SetSessionLanguage:
      type: object
      additionalProperties: false
      required: [language]
      properties:
        language:
          $ref: "#/components/schemas/LanguageCode"
    SourceStatus:
      type: object
      additionalProperties: false
      required: [sourceSystem, editableIn, syncState]
      properties:
        sourceSystem: {type: string, enum: [NPI_ONE, ERPNEXT, COMPUTED]}
        editableIn: {type: string, enum: [NPI_ONE, ERPNEXT, NONE]}
        syncState:
          type: string
          enum: [local, pending, processing, synced, partial, failed_retryable, failed_final, stale, conflict]
        externalUrl: {type: string, format: uri}
        lastSyncedAt: {type: string, format: date-time}
    WorkItem:
      type: object
      required: [id, kind, title, context, status, blocking]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [task, approval, blocker, risk, issue, decision, integration]}
        title: {type: string}
        whyMe: {type: string}
        context: {type: string}
        status: {type: string}
        dueAt: {type: string, format: date-time}
        severity: {type: string, enum: [low, medium, high, critical]}
        blocking: {type: boolean}
        source: {$ref: "#/components/schemas/SourceStatus"}
        primaryAction: {type: string}
    WorkPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/WorkItem"}}
        nextCursor: {type: string}
        counts: {type: object, additionalProperties: {type: integer}}
    ProjectCockpit:
      type: object
      required: [project, gates, nextAction, source]
      properties:
        project: {type: object}
        gates: {type: array, items: {type: object}}
        nextAction: {type: object}
        metrics: {type: object}
        blockers: {type: array, items: {$ref: "#/components/schemas/WorkItem"}}
        objectTree: {type: array, items: {type: object}}
        source: {$ref: "#/components/schemas/SourceStatus"}
    GateReview:
      type: object
      required: [gate, deliverables, blockers, decisionOptions]
      properties:
        gate: {type: object}
        deliverables: {type: array, items: {type: object}}
        blockers: {type: array, items: {$ref: "#/components/schemas/WorkItem"}}
        changesSinceLastReview: {type: array, items: {type: object}}
        decisionOptions: {type: array, items: {type: string}}
    ToolingCockpit:
      type: object
      required: [tooling, lifecycle, source]
      properties:
        tooling: {type: object}
        lifecycle: {type: array, items: {type: object}}
        metrics: {type: object}
        currentDesignRevision: {type: object}
        trials: {type: array, items: {type: object}}
        erpAsset: {type: object}
        source: {$ref: "#/components/schemas/SourceStatus"}
    TrialWorkspace:
      type: object
      required: [trial, lockedInputs, parameters, samples, defects]
      properties:
        trial: {type: object}
        lockedInputs: {type: array, items: {type: object}}
        parameters: {type: array, items: {type: object}}
        samples: {type: array, items: {type: object}}
        defects: {type: array, items: {type: object}}
        qualityResults: {type: array, items: {type: object}}
        comparison: {type: object}
    CreateExecutionRequest:
      type: object
      additionalProperties: false
      required: [operation, globalId, objectVersion, inputSnapshotHash]
      properties:
        operation:
          type: string
          enum: [create_item, update_item_engineering_fields, create_or_update_mbom, create_purchase_request, create_or_update_tool_asset, publish_controlled_file_reference, request_quality_inspection, update_project_handover_status]
        globalId: {type: string, format: uuid}
        objectVersion: {type: integer, minimum: 0}
        inputSnapshotHash: {type: string, pattern: "^[a-fA-F0-9]{64}$"}
        payload: {type: object}
        approvalEvidenceIds:
          type: array
          items: {type: string, format: uuid}
    ExecutionRequest:
      type: object
      required: [id, operation, state, globalId, createdAt]
      properties:
        id: {type: string, format: uuid}
        operation: {type: string}
        state:
          type: string
          enum: [draft, validated, queued, processing, succeeded, partially_succeeded, failed_retryable, failed_final, cancelled]
        globalId: {type: string, format: uuid}
        erpObjectType: {type: string}
        erpObjectId: {type: string}
        attemptCount: {type: integer}
        nextRetryAt: {type: string, format: date-time}
        userMessage: {type: string}
        traceId: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CommandResult:
      type: object
      required: [globalId, version, status]
      properties:
        globalId: {type: string, format: uuid}
        version: {type: integer}
        status: {type: string}
        operationId: {type: string, format: uuid}
    Problem:
      type: object
      required: [type, title, status, traceId]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        traceId: {type: string}
        retryable: {type: boolean}
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              path: {type: string}
              message: {type: string}
