        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, conclusion, inputSnapshotHash]
              properties:
                expectedVersion: { type: integer }
                conclusion:
                  type: string
                  enum:
                    [
                      pass,
                      conditional_pass,
                      tooling_change,
                      design_change,
                      process_tuning,
                      material_change,
