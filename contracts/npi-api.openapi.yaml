          tableSchemaVersion,
          viewId,
          layout,
          filter,
          saveFilter,
          favoriteViewIds,
          recentViewIds,
          defaultProjectId,
        ]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        tableSchemaVersion: { type: string, const: my-work-grid-v1 }
        viewId: { $ref: "#/components/schemas/MyWorkGridViewId" }
        layout: { $ref: "#/components/schemas/MyWorkGridLayout" }
        filter: { $ref: "#/components/schemas/MyWorkGridFilter" }
        saveFilter: { type: boolean }
        favoriteViewIds:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { $ref: "#/components/schemas/MyWorkGridViewId" }
        recentViewIds:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { $ref: "#/components/schemas/MyWorkGridViewId" }
        defaultProjectId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
    MyWorkInspectorPreference:
      type: object
      additionalProperties: false
      required: [paneId, schemaVersion, widthPx, collapsed, recoveryReason]
      properties:
        paneId: { type: string, const: my-work-inspector }
        schemaVersion: { type: string, const: my-work-inspector-v1 }
        widthPx: { type: integer, minimum: 260, maximum: 480 }
        collapsed: { type: boolean }
        recoveryReason:
          oneOf:
