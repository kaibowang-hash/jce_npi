    ProjectLearning:
      type: object
      additionalProperties: false
      required:
        [
          globalId,
          projectGlobalId,
          kind,
          title,
          content,
          recommendation,
          tags,
          templateRef,
          createdBy,
          createdAt,
          version,
          target,
        ]
      properties:
        globalId: { type: string, format: uuid }
        projectGlobalId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ProjectLearningKind" }
        title: { type: string, minLength: 1, maxLength: 280 }
        content: { type: string, minLength: 1, maxLength: 4000 }
        recommendation: { type: string, maxLength: 4000 }
        tags:
          type: array
