openapi: 3.1.0
info:
  title: NPI One Domain API
  version: 1.2.0
  description: >
    Business-oriented API for the independent NPI One web application.
    Raw Frappe DocType CRUD is not the public browser contract.
servers:
  - url: /api/npi/v1
security:
  - sessionAuth: []
  - oauth2: [npi.user]
tags:
  - { name: Session }
  - { name: Work }
  - { name: Projects }
  - { name: Gates }
  - { name: Tooling }
  - { name: Trials }
  - { name: Execution }
paths:
  /session/bootstrap:
    get:
      tags: [Session]
      operationId: getSessionBootstrap
      responses:
        "200":
          description: Authenticated session language and filtered effective NPI catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBootstrap"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /session/language:
    put:
      tags: [Session]
      operationId: setSessionLanguage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSessionLanguage"
      responses:
        "200":
          description: Persisted language and refreshed effective NPI catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBootstrap"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /me/work:
    get:
      tags: [Work]
      operationId: getMyWork
      parameters:
        - in: query
          name: view
          schema:
            {
              type: string,
              enum: [today, overdue, approvals, blockers, waiting, integration],
            }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Unified work queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPage"
        default:
          $ref: "#/components/responses/Error"

  /projects:
    post:
      tags: [Projects]
      operationId: createProjectDraft
      description: >
        Atomically creates one Engineering Project draft and its ordered Gate
        shells from an explicit immutable published Project Template version.
        Reusing an Idempotency-Key with the same canonical request replays the
        original result; reusing it with a different request returns 409. P4-01
        authorizes this command only for an authenticated internal System Manager
        whose configured Site tenant exactly matches tenantId.
      x-required-roles: [System Manager]
      x-transaction-boundary: project-root
      x-audit-operation: project.create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectDraft"
      responses:
        "201":
          description: Project draft and all Gate shells created atomically, or the original result replayed
          headers:
            X-Request-ID:
              description: Validated request identifier supplied by the caller
              required: true
              schema: { type: string, format: uuid }
            X-Trace-ID:
              description: Trace identifier for support and audit correlation
              required: true
              schema:
                {
                  type: string,
                  minLength: 8,
                  maxLength: 128,
                  pattern: "^[A-Za-z0-9._:-]+$",
                }
            Idempotency-Replayed:
              description: True when the original result was safely replayed for the same key and canonical payload
              schema: { type: boolean }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCockpit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "409":
          $ref: "#/components/responses/ProjectConflict"
        "422":
          $ref: "#/components/responses/ProjectValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ProjectError"

  /projects/{projectId}/cockpit:
    get:
      tags: [Projects]
      operationId: getProjectCockpit
      description: >
        Returns the live Project cockpit addressed by immutable Project global_id,
        including the exact published template version and Gate shells ordered by
        ascending sequence. P4-01 allows the Project owner or a System Manager to
        read it. An absent Project and any unauthorized Project both return the
        same 404 representation to prevent object-existence disclosure. Every read
        must also match the authenticated principal's configured Site tenant.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Aggregated project object page view model
          headers:
            X-Request-ID:
              description: Validated request identifier supplied by the caller
              required: true
              schema: { type: string, format: uuid }
            X-Trace-ID:
              description: Trace identifier for support and audit correlation
              required: true
              schema:
                {
                  type: string,
                  minLength: 8,
                  maxLength: 128,
                  pattern: "^[A-Za-z0-9._:-]+$",
                }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCockpit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ProjectValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ProjectError"

  /projects/{projectId}/work-context:
    get:
      tags: [Projects, Work]
      operationId: getProjectWorkContext
      description: >
        Returns the authorized Project Team, explicit RACI assignments, WBS,
        dependencies, immutable plan baselines, and an explicit baseline
        comparison. The Project owner and an internal System Manager may read
        this view. Project membership, a role assignment, RACI, or Domain
        WorkItem ownership does not independently grant Project access.
        Missing, unauthorized, and tenant-mismatched Projects return the same
        404 representation.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Authorized Project work-management view
          headers:
            X-Request-ID:
              description: Validated request identifier supplied by the caller
              required: true
              schema: { type: string, format: uuid }
            X-Trace-ID:
              description: Trace identifier for support and audit correlation
              required: true
              schema:
                {
                  type: string,
                  minLength: 8,
                  maxLength: 128,
                  pattern: "^[A-Za-z0-9._:-]+$",
                }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWorkContext"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ProjectValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ProjectError"

  /projects/{projectId}:configure-team:
    post:
      tags: [Projects, Work]
      operationId: configureProjectTeam
      description: >
        Atomically applies explicit Project members, dated role assignments,
        dated substitutions, and RACI assignments. Omitted existing records are
        retained; this is not a replace-or-delete operation. RACI records
        responsibility only and never confer Project or Gate approval or
        administration authority. P4-02 permits this command only to an
        authenticated internal System Manager in the configured Site tenant.
      x-required-roles: [System Manager]
      x-transaction-boundary: project-root
      x-audit-operation: project.team.configure
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureProjectTeam"
      responses:
        "200":
          description: Team and RACI changes committed atomically, or the original result replayed
          headers:
            X-Request-ID:
              description: Validated request identifier supplied by the caller
              required: true
              schema: { type: string, format: uuid }
            X-Trace-ID:
              description: Trace identifier for support and audit correlation
              required: true
              schema:
                {
                  type: string,
                  minLength: 8,
                  maxLength: 128,
                  pattern: "^[A-Za-z0-9._:-]+$",
                }
            Idempotency-Replayed:
              description: True when the original result was safely replayed
              required: true
              schema: { type: boolean }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWorkContext"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ProjectConflict"
        "422":
          $ref: "#/components/responses/ProjectValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ProjectError"

  /projects/{projectId}:apply-work-plan:
    post:
      tags: [Projects, Work]
      operationId: applyProjectWorkPlan
      description: >
        Atomically creates or amends explicitly identified WBS items and
        directed predecessor dependencies, then validates the complete
        resulting parent and dependency graphs. Omitted existing records are
        retained. It does not infer dependency types, resource optimization, a
        critical path, or a production status lifecycle.
      x-required-roles: [System Manager]
      x-transaction-boundary: project-root
      x-audit-operation: project.work_plan.apply
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyProjectWorkPlan"
      responses:
        "200":
          description: Work-plan changes committed atomically, or the original result replayed
          headers:
            X-Request-ID:
              description: Validated request identifier supplied by the caller
              required: true
              schema: { type: string, format: uuid }
            X-Trace-ID:
              description: Trace identifier for support and audit correlation
              required: true
              schema:
                {
                  type: string,
                  minLength: 8,
                  maxLength: 128,
                  pattern: "^[A-Za-z0-9._:-]+$",
                }
            Idempotency-Replayed:
              description: True when the original result was safely replayed
              required: true
              schema: { type: boolean }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWorkContext"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ProjectConflict"
        "422":
          $ref: "#/components/responses/ProjectValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ProjectError"

  /projects/{projectId}:capture-plan-baseline:
    post:
      tags: [Projects, Work]
      operationId: captureProjectPlanBaseline
      description: >
        Captures an immutable snapshot of every current WBS planned date and
        critical-task indicator under an exact Project Work Policy version.
        The snapshot is append-only and is never replaced by a later plan.
      x-required-roles: [System Manager]
      x-transaction-boundary: project-root
      x-audit-operation: project.plan_baseline.capture
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureProjectPlanBaseline"
      responses:
        "201":
          description: Immutable plan baseline captured, or the original result replayed
          headers:
            X-Request-ID:
              description: Validated request identifier supplied by the caller
              required: true
              schema: { type: string, format: uuid }
            X-Trace-ID:
              description: Trace identifier for support and audit correlation
              required: true
              schema:
                {
                  type: string,
                  minLength: 8,
                  maxLength: 128,
                  pattern: "^[A-Za-z0-9._:-]+$",
                }
            Idempotency-Replayed:
              description: True when the original result was safely replayed
              required: true
              schema: { type: boolean }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPlanBaseline"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ProjectConflict"
        "422":
          $ref: "#/components/responses/ProjectValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ProjectError"

  /projects/{projectId}/domain-work-items:
    get:
      tags: [Projects, Work]
      operationId: listProjectDomainWorkItems
      description: >
        Lists persisted NPI Domain WorkItems inside one already-authorized
        Project. This is not the My Work projection. The Project path is the
        mandatory Project filter; optional stage, owner, overdue, and kind
        filters never expand authorization or reveal another Project's object
        existence. Results use bounded keyset pagination ordered by dueAt and
        globalId. One server-clock instant defines overdue for the complete
        cursor chain and is fixed asOf on the first page: true selects
        non-terminal items before that instant, while false selects terminal
        items or items due at or after it. ownerUserId is normalized to its
        ASCII case-folded lowercase identity before filtering and cursor
        fingerprinting, so owner identity matching is case-insensitive. A v2
        opaque cursor carries dueAt/globalId and asOf separately from a query
        fingerprint. The fingerprint is the SHA-256 of canonical JSON containing
        projectId, nullable stageId, normalized ownerUserId, overdue tri-state,
        and kind; limit is intentionally excluded. A domain-separated HMAC-SHA256
        derived from the current Site's persistent Frappe encryption key signs
        the complete canonical cursor payload, including version, fingerprint,
        asOf, dueAt, and globalId. Follow-up requests must preserve those
        semantic filter values, although ownerUserId letter case may vary.
        Cursor validation occurs only after Project authorization, and an
        invalid, malformed, other-version, query-mismatched, or signature-invalid
        cursor returns the 422 cursor validation representation without querying
        Domain WorkItems. A missing or invalid Site encryption key fails closed
        with the 503 service-unavailable representation. Keyset continuation
        fixes overdue classification only; it does not freeze a database
        mutation snapshot, so concurrent creates or updates may affect later
        pages.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
        - in: query
          name: stageId
          schema: { type: string, format: uuid }
        - in: query
          name: ownerUserId
          description: >
            Owner email identity. The server converts this ASCII value to its
            case-folded lowercase form before filtering and fingerprinting;
            identity matching is case-insensitive.
          schema: { type: string, format: email, minLength: 3, maxLength: 254 }
        - in: query
          name: overdue
          description: Server-clock comparison against dueAt; only literal true or false is accepted
          schema: { type: boolean }
        - in: query
          name: kind
          schema: { $ref: "#/components/schemas/DomainWorkItemKind" }
        - in: query
          name: cursor
          description: >
            Opaque, Site-bound, HMAC-SHA256-signed v2 keyset cursor returned by
            the preceding page. Replay it with the same semantic projectId,
            stageId, ownerUserId, overdue tri-state, and kind filters.
            ownerUserId letter case may vary because its normalized identity is bound;
            limit is intentionally not bound.
          schema:
            {
              type: string,
              minLength: 1,
              maxLength: 500,
              pattern: "^[A-Za-z0-9._~:-]{1,500}$",
            }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Authorized, stably ordered Domain WorkItem page
          headers:
            X-Request-ID:
              description: Validated request identifier supplied by the caller
              required: true
              schema: { type: string, format: uuid }
            X-Trace-ID:
              description: Trace identifier for support and audit correlation
              required: true
              schema:
                {
                  type: string,
                  minLength: 8,
                  maxLength: 128,
                  pattern: "^[A-Za-z0-9._:-]+$",
                }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainWorkItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ProjectValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ProjectError"
    post:
      tags: [Projects, Work]
      operationId: createProjectDomainWorkItem
      description: >
        Creates one Domain WorkItem and derives its initial state from the
        matching kind section of an exact immutable Project Work Policy
        version. The caller cannot submit a shared or arbitrary state, and this
        endpoint does not implement a lifecycle transition.
      x-required-roles: [System Manager]
      x-transaction-boundary: project-root
      x-audit-operation: project.domain_work_item.create
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainWorkItem"
      responses:
        "201":
          description: Domain WorkItem created, or the original result replayed
          headers:
            X-Request-ID:
              description: Validated request identifier supplied by the caller
              required: true
              schema: { type: string, format: uuid }
            X-Trace-ID:
              description: Trace identifier for support and audit correlation
              required: true
              schema:
                {
                  type: string,
                  minLength: 8,
                  maxLength: 128,
                  pattern: "^[A-Za-z0-9._:-]+$",
                }
            Idempotency-Replayed:
              description: True when the original result was safely replayed
              required: true
              schema: { type: boolean }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainWorkItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ProjectConflict"
        "422":
          $ref: "#/components/responses/ProjectValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ProjectError"

  /projects/{projectId}/gates/{gateId}/review:
    get:
      tags: [Gates]
      operationId: getGateReview
      description: >
        Returns one server-built review workspace for the exact Project and
        Gate identities. Missing, unauthorized, cross-tenant, and mismatched
        identities return the same Gate-unavailable 404 representation.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/GateId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          $ref: "#/components/responses/GateReviewQueryResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ProjectValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ProjectError"

  /projects/{projectId}/gates/{gateId}/review-command-receipts/{operation}:
    get:
      tags: [Gates]
      operationId: getGateReviewCommandReceipt
      description: >
        Reconciles one exact current-actor Gate review command after navigation
        or hard reload. The raw idempotency key remains in the required header;
        request payloads and sealed responses are never returned. This read
        waits on the same Project then Gate locks used by commands, so a
        committed effect has a completed sealed receipt and a rolled-back or
        never-arrived effect is absent.
      x-business-authority: exact-current-actor-command-receipt
      x-lock-order: [project, gate]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/GateId"
        - in: path
          name: operation
          required: true
          schema:
            {
              type: string,
              enum:
                [
                  gate.review.start,
                  gate.review.submit,
                  gate.review.exception.request,
                  gate.review.exception.decide,
                  gate.review.decide,
                  gate.review.reopen,
                ],
            }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Exact actor-bound receipt reconciliation result
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: "private, no-store" }
            X-Request-ID:
              required: true
              schema: { type: string, format: uuid }
            X-Trace-ID:
              required: true
              schema:
                {
                  type: string,
                  minLength: 8,
                  maxLength: 128,
                  pattern: "^[A-Za-z0-9._:-]+$",
                }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateReviewCommandReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ProjectValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ProjectError"

  /projects/{projectId}/gates/{gateId}:start-review:
    post:
      tags: [Gates]
      operationId: startGateReview
      description: >
        Management command that starts one review cycle from an exact published
        Gate Review Policy version and explicit current Project-member bindings.
        System Manager authorizes only this management operation; it does not
        grant review, exception, decision, or reopen authority.
      x-required-management-role: System Manager
      x-business-authority: management-command-only
      x-transaction-boundary: gate-root
      x-audit-operation: gate.review.start
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/GateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartGateReview"
      responses:
        "201":
          $ref: "#/components/responses/GateReviewCommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "404":
