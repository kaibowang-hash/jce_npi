          oneOf: [{ type: string, pattern: "^-?[0-9]+(?:\\.[0-9]+)?$" }, { type: "null" }]
        comparisonState:
          { type: string, readOnly: true, enum: [measured, not_measured, unavailable, within_spec, out_of_spec] }
        sourceRevision:
          oneOf: [{ $ref: "#/components/schemas/TrialReviewExactReference" }, { type: "null" }]
        deltaFromPrevious:
          oneOf: [{ type: string, pattern: "^-?[0-9]+(?:\\.[0-9]+)?$" }, { type: "null" }]
    TrialMetricComparisonRow:
      type: object
      additionalProperties: false
      required: [metricKind, metricKey, cavityGlobalId, unitState, cells]
      properties:
        metricKind: { type: string, enum: [parameter, dimension, cycle_time, yield] }
        metricKey: { type: string, minLength: 1, maxLength: 256 }
        cavityGlobalId:
          description: Exact cavity identity for dimension rows; null is allowed only for the explicit all-unavailable dimension sentinel.
          oneOf: [{ type: string, format: uuid }, { type: "null" }]
        unitState: { type: string, readOnly: true, enum: [comparable, unit_mismatch, unavailable] }
        cells:
          type: array
          minItems: 2
          maxItems: 100
          items: { $ref: "#/components/schemas/TrialMetricComparisonCell" }
    TrialDefectTrend:
      type: object
      additionalProperties: false
      required: [defectGlobalId, state]
      properties:
        defectGlobalId: { type: string, format: uuid }
        state: { type: string, readOnly: true, enum: [new, continued, resolved, reopened] }
    TrialRoundComparisonSnapshot:
      type: object
      additionalProperties: false
      description: Immutable multi-Round comparison; absent governed cycle time or yield remains unavailable and is never imputed as zero.
      required:
        [schemaVersion, globalId, tenantId, projectGlobalId,
         trialPlanGlobalId, targetRoundGlobalId, policyRevision, sources,
         inputRows, metricRows, defectTrends, formalErpQuality,
         createdByUserId, createdAt, requestId, traceId, snapshotHash]
      properties:
        schemaVersion: { type: string, const: npi.trial.v1 }
        globalId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1, maxLength: 256 }
        projectGlobalId: { type: string, format: uuid }
        trialPlanGlobalId: { type: string, format: uuid }
        targetRoundGlobalId: { type: string, format: uuid }
        policyRevision: { $ref: "#/components/schemas/TrialReviewExactReference" }
        sources:
          type: array
          minItems: 2
          maxItems: 100
          items: { $ref: "#/components/schemas/TrialRoundComparisonSource" }
        inputRows:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: "#/components/schemas/TrialInputComparisonRow" }
        metricRows:
          type: array
          minItems: 4
          maxItems: 10000
          items: { $ref: "#/components/schemas/TrialMetricComparisonRow" }
        defectTrends:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/TrialDefectTrend" }
        formalErpQuality: { type: string, readOnly: true, const: unavailable }
        createdByUserId: { type: string, minLength: 1, maxLength: 254 }
        createdAt: { type: string, format: date-time }
        requestId: { type: string, format: uuid }
        traceId: { type: string, minLength: 1, maxLength: 256 }
        snapshotHash: { $ref: "#/components/schemas/TrialReviewSha256" }
    TrialReviewReferenceRevision:
      type: object
      additionalProperties: false
      description: Controlled evidence reference. Presence never grants customer, production or formal ERP quality approval.
      required:
        [schemaVersion, globalId, referenceGlobalId, tenantId,
         projectGlobalId, trialRoundGlobalId, comparisonSnapshot,
         referenceKind, referenceVersion, predecessorGlobalId,
         predecessorSnapshotHash, partRevision, toolingMasterGlobalId,
         toolingRevision, toolingSet, fileRevision, effectiveFrom,
         effectiveTo, approvalAuthority, reason, createdByUserId,
         createdAt, requestId, traceId, versionKeyHash, snapshotHash]
      properties:
        schemaVersion: { type: string, const: npi.trial.v1 }
        globalId: { type: string, format: uuid }
        referenceGlobalId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1, maxLength: 256 }
        projectGlobalId: { type: string, format: uuid }
        trialRoundGlobalId: { type: string, format: uuid }
        comparisonSnapshot: { $ref: "#/components/schemas/TrialReviewExactReference" }
        referenceKind:
          { type: string, enum: [controlled_quality_report, internal_sample_review, customer_evidence, deviation_or_waiver] }
        referenceVersion: { type: integer, minimum: 1 }
        predecessorGlobalId:
          oneOf: [{ type: string, format: uuid }, { type: "null" }]
        predecessorSnapshotHash:
          oneOf: [{ $ref: "#/components/schemas/TrialReviewSha256" }, { type: "null" }]
        partRevision: { $ref: "#/components/schemas/TrialReviewExactReference" }
        toolingMasterGlobalId: { type: string, format: uuid }
        toolingRevision: { $ref: "#/components/schemas/TrialReviewExactReference" }
        toolingSet: { $ref: "#/components/schemas/TrialReviewExactReference" }
        fileRevision: { $ref: "#/components/schemas/TrialReviewExactReference" }
        effectiveFrom:
          oneOf: [{ type: string, format: date }, { type: "null" }]
        effectiveTo:
          oneOf: [{ type: string, format: date }, { type: "null" }]
        approvalAuthority: { type: string, readOnly: true, const: unavailable }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        createdByUserId: { type: string, minLength: 1, maxLength: 254 }
        createdAt: { type: string, format: date-time }
        requestId: { type: string, format: uuid }
        traceId: { type: string, minLength: 1, maxLength: 256 }
        versionKeyHash: { $ref: "#/components/schemas/TrialReviewSha256" }
        snapshotHash: { $ref: "#/components/schemas/TrialReviewSha256" }
    TrialConclusionBlocker:
      type: object
      additionalProperties: false
      required: [code, sourceKey]
      properties:
        code:
          type: string
          readOnly: true
          enum: [missing_input_lock, missing_actual, required_parameter_not_measured, missing_cavity_result, required_dimension_not_measured, open_blocking_defect, required_action_not_verified, required_review_reference_unavailable, out_of_spec_blocking]
        sourceKey: { type: string, minLength: 1, maxLength: 256 }
    TrialOnePageSummaryExactReference:
      type: object
      additionalProperties: false
      required: [globalId, snapshotHash]
      properties:
        globalId: { type: string, format: uuid }
        snapshotHash: { $ref: "#/components/schemas/TrialReviewSha256" }
    TrialOnePageSummaryReviewReference:
      type: object
      additionalProperties: false
      required: [globalId, snapshotHash, referenceKind]
      properties:
        globalId: { type: string, format: uuid }
        snapshotHash: { $ref: "#/components/schemas/TrialReviewSha256" }
        referenceKind:
          { type: string, enum: [controlled_quality_report, internal_sample_review, customer_evidence, deviation_or_waiver] }
    TrialOnePageSummaryExternalEffects:
      type: object
      additionalProperties: false
      required: [nextWork, gate, npiReadiness, toolingLifecycle]
      properties:
        nextWork: { type: string, const: proposal_only }
        gate: { type: string, const: unavailable }
        npiReadiness: { type: string, const: unavailable }
        toolingLifecycle: { type: string, const: unavailable }
    TrialOnePageSummaryInput:
      type: object
      additionalProperties: false
      required:
        [schemaVersion, comparisonSnapshot, rounds, targetRoundGlobalId,
         inputChangeCounts, metricRowHashes, defectTrendCounts,
         reviewReferences, cycleTimeState, yieldState, formalErpQuality,
         conclusionCode, conclusionState, externalEffects]
      properties:
        schemaVersion: { type: string, const: npi.trial.v1 }
        comparisonSnapshot: { $ref: "#/components/schemas/TrialOnePageSummaryExactReference" }
        rounds:
          type: array
          minItems: 2
          maxItems: 100
          items: { $ref: "#/components/schemas/TrialOnePageSummaryExactReference" }
        targetRoundGlobalId: { type: string, format: uuid }
        inputChangeCounts:
          type: object
          additionalProperties: false
          required: [added, removed, changed, same]
          properties:
            added: { type: integer, minimum: 0 }
            removed: { type: integer, minimum: 0 }
            changed: { type: integer, minimum: 0 }
            same: { type: integer, minimum: 0 }
        metricRowHashes:
          type: array
          minItems: 4
          maxItems: 10000
          items: { $ref: "#/components/schemas/TrialReviewSha256" }
        defectTrendCounts:
          type: object
          additionalProperties: false
          required: [new, continued, resolved, reopened]
          properties:
            new: { type: integer, minimum: 0 }
            continued: { type: integer, minimum: 0 }
            resolved: { type: integer, minimum: 0 }
            reopened: { type: integer, minimum: 0 }
        reviewReferences:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/TrialOnePageSummaryReviewReference" }
        cycleTimeState:
          { type: string, enum: [measured, not_measured, unavailable, within_spec, out_of_spec] }
        yieldState:
          { type: string, enum: [measured, not_measured, unavailable, within_spec, out_of_spec] }
        formalErpQuality: { type: string, const: unavailable }
        conclusionCode:
          { type: string, enum: [pass, conditional_pass, tooling_change, design_change, process_tuning, material_change, cancelled] }
        conclusionState: { type: string, enum: [submitted, approved, rejected, reopened] }
        externalEffects: { $ref: "#/components/schemas/TrialOnePageSummaryExternalEffects" }
    TrialConclusionExternalEffects:
      type: object
      additionalProperties: false
      required: [nextWork, gate, npiReadiness, toolingLifecycle, formalErpQuality, customerSignature]
      properties:
        nextWork: { type: string, const: proposal_only }
        gate: { type: string, const: unavailable }
        npiReadiness: { type: string, const: unavailable }
        toolingLifecycle: { type: string, const: unavailable }
        formalErpQuality: { type: string, const: unavailable }
        customerSignature: { type: string, const: unavailable }
    TrialConclusionRevision:
      type: object
      additionalProperties: false
      description: Immutable submit, decision or reopen revision. Proposed effects never mutate Gate, NPI readiness, Tooling lifecycle or external quality.
      required:
        [schemaVersion, globalId, conclusionGlobalId, tenantId,
         projectGlobalId, trialRoundGlobalId, trialRoundOptimisticVersion,
         trialRoundSnapshotHash, conclusionVersion, predecessorGlobalId,
         predecessorSnapshotHash, state, conclusionCode, policyRevision,
         comparisonSnapshot, reviewReferences, blockers, summaryInput,
         proposedNextWork, proposedGateEffect, proposedNpiEffect,
         externalEffects, reason, createdByUserId, createdAt, requestId,
         traceId, versionKeyHash, snapshotHash]
      properties:
        schemaVersion: { type: string, const: npi.trial.v1 }
        globalId: { type: string, format: uuid }
        conclusionGlobalId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1, maxLength: 256 }
        projectGlobalId: { type: string, format: uuid }
        trialRoundGlobalId: { type: string, format: uuid }
        trialRoundOptimisticVersion: { type: integer, minimum: 1 }
        trialRoundSnapshotHash: { $ref: "#/components/schemas/TrialReviewSha256" }
        conclusionVersion: { type: integer, minimum: 1 }
        predecessorGlobalId:
          oneOf: [{ type: string, format: uuid }, { type: "null" }]
        predecessorSnapshotHash:
          oneOf: [{ $ref: "#/components/schemas/TrialReviewSha256" }, { type: "null" }]
        state: { type: string, enum: [submitted, approved, rejected, reopened] }
        conclusionCode:
          { type: string, enum: [pass, conditional_pass, tooling_change, design_change, process_tuning, material_change, cancelled] }
        policyRevision: { $ref: "#/components/schemas/TrialReviewExactReference" }
        comparisonSnapshot: { $ref: "#/components/schemas/TrialReviewExactReference" }
        reviewReferences:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/TrialReviewExactReference" }
        blockers:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/TrialConclusionBlocker" }
        summaryInput: { $ref: "#/components/schemas/TrialOnePageSummaryInput" }
        proposedNextWork:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 1000 }
        proposedGateEffect: { type: string, minLength: 1, maxLength: 1000 }
        proposedNpiEffect: { type: string, minLength: 1, maxLength: 1000 }
        externalEffects: { $ref: "#/components/schemas/TrialConclusionExternalEffects" }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        createdByUserId: { type: string, minLength: 1, maxLength: 254 }
        createdAt: { type: string, format: date-time }
        requestId: { type: string, format: uuid }
        traceId: { type: string, minLength: 1, maxLength: 256 }
        versionKeyHash: { $ref: "#/components/schemas/TrialReviewSha256" }
        snapshotHash: { $ref: "#/components/schemas/TrialReviewSha256" }
    ReadinessSha256:
      type: string
      minLength: 64
      maxLength: 64
      pattern: "^[0-9a-f]{64}$"
    ReadinessApplicabilitySelector:
      type: object
      additionalProperties: false
      required: [projectTypes, customerReferenceKeys, industryKeys]
      properties:
        projectTypes:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, enum: [customer_owned_tool, new_tool, tool_change] }
        customerReferenceKeys:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 256 }
        industryKeys:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
    ReadinessCategoryDefinition:
      type: object
      additionalProperties: false
      required: [key, title]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        title: { type: string, minLength: 1, maxLength: 200 }
    ReadinessEvidenceRequirement:
      type: object
      additionalProperties: false
      required: [key, acceptedSourceKinds, minimumCount, unavailableBlocks]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        acceptedSourceKinds:
          type: array
          minItems: 1
          maxItems: 30
          uniqueItems: true
          items:
            type: string
            enum: [project, domain_work_item, released_document, release_baseline, file_revision, tooling_capacity_scenario, trial_input_lock, trial_actual, trial_sample, trial_cavity_result, trial_defect, trial_defect_verification, trial_comparison, trial_review_reference, trial_conclusion, controlled_quality_result, erp_material_specification, erp_quality_result, erp_run_at_rate, erp_hr_qualification, erp_supplier_execution]
        minimumCount: { type: integer, minimum: 1, maximum: 100 }
        unavailableBlocks: { type: boolean }
    ReadinessItemDefinition:
      type: object
      additionalProperties: false
      required: [key, title, categoryKey, weight, required, blockingLevel, gateKey, completionRule, applicability, evidenceRequirements]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        title: { type: string, minLength: 1, maxLength: 240 }
        categoryKey: { type: string, minLength: 1, maxLength: 128 }
        weight: { type: integer, minimum: 1 }
        required: { type: boolean }
        blockingLevel: { type: string, enum: [P0, P1, P2, none] }
        gateKey: { type: string, minLength: 1, maxLength: 128 }
        completionRule:
          type: string
          description: A controlled quality report is exact evidence only; exact_source_result accepts only governed result dispositions.
          enum: [confirmation, exact_evidence, exact_source_result]
        applicability: { $ref: "#/components/schemas/ReadinessApplicabilitySelector" }
        evidenceRequirements:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ReadinessEvidenceRequirement" }
    ReadinessTemplateVersion:
      type: object
      additionalProperties: false
      description: Exact draft or immutable published readiness configuration. Metadata installs no production default row.
      required: [globalId, templateGlobalId, templateCode, templateVersion, optimisticVersion, title, publicationState, applicability, categories, items, changedByUserId, changedAt, requestId, traceId, snapshotHash]
      properties:
        globalId: { type: string, format: uuid }
        templateGlobalId: { type: string, format: uuid }
        templateCode: { type: string, minLength: 1, maxLength: 64 }
        templateVersion: { type: integer, minimum: 1 }
        optimisticVersion: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        publicationState: { type: string, enum: [draft, published] }
        applicability: { $ref: "#/components/schemas/ReadinessApplicabilitySelector" }
        categories:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ReadinessCategoryDefinition" }
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/ReadinessItemDefinition" }
        changedByUserId: { type: string, minLength: 1, maxLength: 254 }
        changedAt: { type: string, format: date-time }
        requestId: { type: string, format: uuid }
        traceId: { type: string, minLength: 1, maxLength: 128 }
        snapshotHash: { $ref: "#/components/schemas/ReadinessSha256" }
    ReadinessExactReference:
      type: object
      additionalProperties: false
      required: [globalId, version, snapshotHash]
      properties:
        globalId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        snapshotHash: { $ref: "#/components/schemas/ReadinessSha256" }
    ReadinessProjectSnapshot:
      type: object
      additionalProperties: false
      description: Exact Project facts plus an NPI-owned frozen industry key; never ERP customer-master truth.
      required: [globalId, optimisticVersion, snapshotHash, projectType, customerReferenceKeys, industryKey]
      properties:
        globalId: { type: string, format: uuid }
        optimisticVersion: { type: integer, minimum: 1 }
        snapshotHash: { $ref: "#/components/schemas/ReadinessSha256" }
        projectType: { type: string, enum: [customer_owned_tool, new_tool, tool_change] }
        customerReferenceKeys:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 256 }
        industryKey: { type: string, minLength: 1, maxLength: 128 }
    ReadinessMemberReference:
      type: object
      additionalProperties: false
      required: [globalId, userId, optimisticVersion]
      properties:
        globalId: { type: string, format: uuid }
        userId: { type: string, minLength: 1, maxLength: 254 }
        optimisticVersion: { type: integer, minimum: 1 }
    ReadinessGateReference:
      type: object
      additionalProperties: false
      required: [globalId, gateKey, optimisticVersion, snapshotHash]
      properties:
        globalId: { type: string, format: uuid }
        gateKey: { type: string, minLength: 1, maxLength: 128 }
        optimisticVersion: { type: integer, minimum: 1 }
        snapshotHash: { $ref: "#/components/schemas/ReadinessSha256" }
    ReadinessSourceReference:
      type: object
      additionalProperties: false
      description: Exact internal source or explicitly identity-free unavailable external provider; caller status is never authority.
      required: [requirementKey, kind, state, globalId, sourceVersion, snapshotHash, reasonCode]
      properties:
        requirementKey: { type: string, minLength: 1, maxLength: 128 }
        kind:
          type: string
          enum: [project, domain_work_item, released_document, release_baseline, file_revision, tooling_capacity_scenario, trial_input_lock, trial_actual, trial_sample, trial_cavity_result, trial_defect, trial_defect_verification, trial_comparison, trial_review_reference, trial_conclusion, controlled_quality_result, erp_material_specification, erp_quality_result, erp_run_at_rate, erp_hr_qualification, erp_supplier_execution]
        state: { type: string, enum: [satisfied, failed, unavailable] }
        globalId:
          oneOf: [{ type: string, format: uuid }, { type: "null" }]
        sourceVersion:
          oneOf: [{ type: integer, minimum: 1 }, { type: "null" }]
        snapshotHash:
          oneOf: [{ $ref: "#/components/schemas/ReadinessSha256" }, { type: "null" }]
        reasonCode:
          oneOf: [{ type: string, minLength: 1, maxLength: 128 }, { type: "null" }]
    ReadinessItemSnapshot:
      type: object
      additionalProperties: false
      required: [globalId, itemVersion, definition, applicable, gate, owner, dueDate, state, confirmationValue, sources]
      properties:
        globalId: { type: string, format: uuid }
        itemVersion: { type: integer, minimum: 1 }
        definition: { $ref: "#/components/schemas/ReadinessItemDefinition" }
        applicable: { type: boolean }
        gate: { $ref: "#/components/schemas/ReadinessGateReference" }
        owner:
          oneOf: [{ $ref: "#/components/schemas/ReadinessMemberReference" }, { type: "null" }]
        dueDate:
          oneOf: [{ type: string, format: date }, { type: "null" }]
        state: { type: string, enum: [not_started, in_progress, complete, failed, not_applicable] }
        confirmationValue:
          oneOf: [{ type: string, minLength: 1, maxLength: 4000 }, { type: "null" }]
        sources:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ReadinessSourceReference" }
    ReadinessScore:
      type: object
      additionalProperties: false
      required: [categoryKey, earnedWeight, applicableWeight, basisPoints, state]
      properties:
        categoryKey:
          oneOf: [{ type: string, minLength: 1, maxLength: 128 }, { type: "null" }]
        earnedWeight: { type: integer, minimum: 0 }
        applicableWeight: { type: integer, minimum: 0 }
        basisPoints:
          oneOf: [{ type: integer, minimum: 0, maximum: 10000 }, { type: "null" }]
        state: { type: string, enum: [scored, not_applicable] }
    ReadinessBlocker:
      type: object
      additionalProperties: false
      description: Blockers remain visible and dominant regardless of score; they do not decide or close a Gate.
      required: [code, itemGlobalId, itemKey, gate]
      properties:
        code: { type: string, enum: [incomplete_p0, failed_mandatory_quality, required_source_unavailable] }
        itemGlobalId: { type: string, format: uuid }
        itemKey: { type: string, minLength: 1, maxLength: 128 }
        gate: { $ref: "#/components/schemas/ReadinessGateReference" }
    ReadinessEvaluation:
      type: object
      additionalProperties: false
      required: [formulaVersion, categoryScores, totalScore, blockers, ready]
      properties:
        formulaVersion: { type: string, const: readiness-score.v1 }
        categoryScores:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ReadinessScore" }
        totalScore: { $ref: "#/components/schemas/ReadinessScore" }
        blockers:
          type: array
          maxItems: 3000
          items: { $ref: "#/components/schemas/ReadinessBlocker" }
        ready: { type: boolean, readOnly: true }
    ReadinessInstanceRevision:
      type: object
      additionalProperties: false
      description: Immutable Project instance revision. Scores and blockers are server-derived; no Gate, Work Item, risk, Tooling, handover or external mutation is performed.
      required: [globalId, instanceGlobalId, tenantId, project, templateRevision, instanceVersion, predecessorGlobalId, predecessorSnapshotHash, categories, items, evaluation, createdByUserId, createdAt, requestId, traceId, versionKeyHash, snapshotHash]
      properties:
        globalId: { type: string, format: uuid }
        instanceGlobalId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1, maxLength: 128 }
        project: { $ref: "#/components/schemas/ReadinessProjectSnapshot" }
        templateRevision: { $ref: "#/components/schemas/ReadinessExactReference" }
        instanceVersion: { type: integer, minimum: 1 }
        predecessorGlobalId:
          oneOf: [{ type: string, format: uuid }, { type: "null" }]
        predecessorSnapshotHash:
          oneOf: [{ $ref: "#/components/schemas/ReadinessSha256" }, { type: "null" }]
        categories:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ReadinessCategoryDefinition" }
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/ReadinessItemSnapshot" }
        evaluation: { $ref: "#/components/schemas/ReadinessEvaluation" }
        createdByUserId: { type: string, minLength: 1, maxLength: 254 }
        createdAt: { type: string, format: date-time }
        requestId: { type: string, format: uuid }
        traceId: { type: string, minLength: 1, maxLength: 128 }
        versionKeyHash: { $ref: "#/components/schemas/ReadinessSha256" }
        snapshotHash: { $ref: "#/components/schemas/ReadinessSha256" }
    CreateReadinessTemplate:
      type: object
      additionalProperties: false
      required: [templateCode, title, applicability, categories, items]
      properties:
        templateCode:
          { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$" }
        title: { type: string, minLength: 1, maxLength: 200 }
        applicability: { $ref: "#/components/schemas/ReadinessApplicabilitySelector" }
        categories:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ReadinessCategoryDefinition" }
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/ReadinessItemDefinition" }
    EditReadinessTemplate:
      type: object
      additionalProperties: false
      required: [expectedOptimisticVersion, title, applicability, categories, items]
      properties:
        expectedOptimisticVersion: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        applicability: { $ref: "#/components/schemas/ReadinessApplicabilitySelector" }
        categories:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ReadinessCategoryDefinition" }
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/ReadinessItemDefinition" }
    PublishReadinessTemplate:
      type: object
      additionalProperties: false
      required: [expectedOptimisticVersion]
      properties:
        expectedOptimisticVersion: { type: integer, minimum: 1 }
    ReadinessTemplateCatalog:
      type: object
      additionalProperties: false
      required: [projectGlobalId, templates]
      properties:
        projectGlobalId: { type: string, format: uuid }
        templates:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ReadinessTemplateVersion" }
    ReadinessAssignment:
      type: object
      additionalProperties: false
      required: [itemKey, ownerMemberGlobalId, dueDate]
      properties:
        itemKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        ownerMemberGlobalId: { type: string, format: uuid }
        dueDate: { type: string, format: date }
    InitializeProjectReadiness:
      type: object
      additionalProperties: false
      description: Project, customer, Gate and item state are resolved and frozen by the server; the caller supplies no score or blocker truth.
      required: [templateRevisionGlobalId, templateVersion, templateSnapshotHash, industryKey, assignments]
      properties:
        templateRevisionGlobalId: { type: string, format: uuid }
        templateVersion: { type: integer, minimum: 1 }
        templateSnapshotHash: { $ref: "#/components/schemas/ReadinessSha256" }
        industryKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        assignments:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/ReadinessAssignment" }
    ReadinessInternalSourceSelection:
      type: object
      additionalProperties: false
      required: [requirementKey, kind, globalId, sourceVersion, snapshotHash]
      properties:
        requirementKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        kind:
          type: string
          enum: [project, domain_work_item, released_document, release_baseline, file_revision, tooling_capacity_scenario, trial_input_lock, trial_actual, trial_sample, trial_cavity_result, trial_defect, trial_defect_verification, trial_comparison, trial_review_reference, trial_conclusion, controlled_quality_result]
        globalId: { type: string, format: uuid }
        sourceVersion: { type: integer, minimum: 1 }
        snapshotHash: { $ref: "#/components/schemas/ReadinessSha256" }
    ReadinessExternalSourceSelection:
      type: object
      additionalProperties: false
      description: Selects one configured formal provider kind; identity and unavailable state remain server-owned.
      required: [requirementKey, kind]
      properties:
        requirementKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        kind:
          type: string
          enum: [erp_material_specification, erp_quality_result, erp_run_at_rate, erp_hr_qualification, erp_supplier_execution]
    ReadinessSourceSelection:
      description: Closed union of one exact internal source or one identity-free formal provider kind; caller source state is forbidden.
      oneOf:
        - { $ref: "#/components/schemas/ReadinessInternalSourceSelection" }
        - { $ref: "#/components/schemas/ReadinessExternalSourceSelection" }
    ReviseProjectReadinessItem:
      type: object
      additionalProperties: false
      description: Scores, blockers, applicability, Gate identity and source disposition are server-derived and cannot be submitted.
      required: [expectedInstanceVersion, expectedRevisionGlobalId, expectedRevisionSnapshotHash, itemKey, ownerMemberGlobalId, dueDate, state, confirmationValue, sources]
      properties:
        expectedInstanceVersion: { type: integer, minimum: 1 }
        expectedRevisionGlobalId: { type: string, format: uuid }
        expectedRevisionSnapshotHash: { $ref: "#/components/schemas/ReadinessSha256" }
        itemKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        ownerMemberGlobalId: { type: string, format: uuid }
        dueDate: { type: string, format: date }
        state: { type: string, enum: [not_started, in_progress, complete, failed] }
        confirmationValue:
          oneOf: [{ type: string, minLength: 1, maxLength: 4000 }, { type: "null" }]
        sources:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ReadinessSourceSelection" }
    ReadinessUnavailableProjection:
      type: object
      additionalProperties: false
      description: Explicit formal-provider hold. It performs no ERP or network call and accepts no caller disposition.
      required: [kind, state, reasonCode, sourceIdentity, observedAt, value, unit]
      properties:
        kind:
          type: string
          enum: [erp_material_specification, erp_quality_result, erp_run_at_rate, erp_hr_qualification, erp_supplier_execution]
        state: { type: string, const: unavailable }
        reasonCode:
          type: string
          enum: [erp_material_specification_provider_unavailable, erp_quality_result_provider_unavailable, erp_run_at_rate_provider_unavailable, erp_hr_qualification_provider_unavailable, erp_supplier_execution_provider_unavailable]
    ReadinessSourceOption:
      type: object
      additionalProperties: false
      description: Server-validated Project Work Item source identity exposed by the readiness workspace so the browser never invents a private snapshot hash.
      required: [kind, globalId, sourceVersion, snapshotHash, label, stateLabelSource, stateTerminal]
      properties:
        kind: { type: string, const: domain_work_item }
        globalId: { type: string, format: uuid }
        sourceVersion: { type: integer, minimum: 1 }
        snapshotHash: { $ref: "#/components/schemas/ReadinessSha256" }
        label: { type: string, minLength: 1, maxLength: 280 }
        stateLabelSource:
          type: string
          description: Literal English source string from the canonical Project Work policy label registry.
          enum: [Draft, Identified, Not started, Open, Requested]
        stateTerminal: { type: boolean }
    ReadinessPermissions:
      type: object
      additionalProperties: false
      required: [canManageTemplates, canInitialize, canRevise]
      properties:
        canManageTemplates: { type: boolean }
        canInitialize: { type: boolean }
        canRevise: { type: boolean }
    ReadinessWorkspace:
      type: object
      additionalProperties: false
      description: Exact Project readiness history ordered oldest to newest; formal ERP projections remain explicitly unavailable.
      required: [projectGlobalId, currentRevision, revisions, sourceOptions, unavailableProjections, permissions]
      properties:
        projectGlobalId: { type: string, format: uuid }
        currentRevision:
          oneOf: [{ $ref: "#/components/schemas/ReadinessInstanceRevision" }, { type: "null" }]
        revisions:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ReadinessInstanceRevision" }
        sourceOptions:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ReadinessSourceOption" }
        unavailableProjections:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: "#/components/schemas/ReadinessUnavailableProjection" }
        permissions: { $ref: "#/components/schemas/ReadinessPermissions" }
    ProductionTransitionSha256:
      type: string
      pattern: "^[a-f0-9]{64}$"
    ProductionTransitionApplicability:
      type: object
      additionalProperties: false
      required: [projectTypes, projectGlobalIds, customerReferenceKeys]
      properties:
        projectTypes:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, enum: [customer_owned_tool, new_tool, tool_change] }
        projectGlobalIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: string, format: uuid }
        customerReferenceKeys:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 256 }
    ProductionTransitionReceivingGroupDefinition:
      type: object
      additionalProperties: false
      description: NPI receiving-group key only; it does not assert a formal HR or ERP production department.
      required: [key, title]
      properties:
        key: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$" }
        title: { type: string, minLength: 1, maxLength: 200 }
    ProductionTransitionAcknowledgementSlotDefinition:
      type: object
      additionalProperties: false
      description: Policy slot definition; publication validation requires at least one sender and one receiver slot.
      required: [key, groupKey, direction, allowedProjectRoleKeys]
      properties:
        key: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$" }
        groupKey: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$" }
        direction: { type: string, enum: [sender, receiver] }
        allowedProjectRoleKeys:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$" }
    ProductionTransitionHandoverObjectRequirement:
      type: object
      additionalProperties: false
      description: The published policy owns the canonical manifest role; a handover caller selects only the requirement and exact source identity/version.
      required: [key, acceptedSourceKinds, manifestRole, minimumCount]
      properties:
        key: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$" }
        acceptedSourceKinds:
          type: array
          minItems: 1
          maxItems: 9
          uniqueItems: true
          items: { $ref: "#/components/schemas/ProductionTransitionSourceKind" }
        manifestRole: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$" }
        minimumCount: { type: integer, minimum: 1, maximum: 1000 }
    ProductionTransitionMetricRule:
      oneOf:
        - $ref: "#/components/schemas/ProductionTransitionActualSopRule"
        - $ref: "#/components/schemas/ProductionTransitionCustomerComplaintRule"
        - $ref: "#/components/schemas/ProductionTransitionFirstBatchYieldRule"
        - $ref: "#/components/schemas/ProductionTransitionCycleTimeRule"
        - $ref: "#/components/schemas/ProductionTransitionToolingStabilityRule"
    ProductionTransitionAllowedDispositions:
      type: array
      minItems: 1
      maxItems: 4
      uniqueItems: true
      items: { type: string, enum: [not_evaluable, within_rule, outside_rule, review_required] }
      contains: { const: not_evaluable }
      minContains: 1
      maxContains: 1
    ProductionTransitionActualSopRule:
      type: object
      additionalProperties: false
      required: [providerKind, unit, comparator, threshold, allowedDispositions]
      properties:
        providerKind: { type: string, const: actual_sop }
        comparator: { type: "null" }
        threshold: { type: "null" }
        allowedDispositions: { $ref: "#/components/schemas/ProductionTransitionAllowedDispositions" }
        unit: { type: "null" }
    ProductionTransitionCustomerComplaintRule:
      type: object
      additionalProperties: false
      required: [providerKind, unit, comparator, threshold, allowedDispositions]
      properties:
        providerKind: { type: string, const: customer_complaint }
        comparator: { type: string, enum: [less_than_or_equal, greater_than_or_equal, equal] }
        threshold: { type: string, pattern: "^-?[0-9]+(?:\\.[0-9]+)?$" }
        allowedDispositions: { $ref: "#/components/schemas/ProductionTransitionAllowedDispositions" }
        unit: { type: string, minLength: 1, maxLength: 32 }
    ProductionTransitionFirstBatchYieldRule:
      type: object
      additionalProperties: false
      required: [providerKind, unit, comparator, threshold, allowedDispositions]
      properties:
        providerKind: { type: string, const: first_batch_yield }
        comparator: { type: string, enum: [less_than_or_equal, greater_than_or_equal, equal] }
        threshold: { type: string, pattern: "^-?[0-9]+(?:\\.[0-9]+)?$" }
        allowedDispositions: { $ref: "#/components/schemas/ProductionTransitionAllowedDispositions" }
        unit: { type: string, minLength: 1, maxLength: 32 }
    ProductionTransitionCycleTimeRule:
      type: object
      additionalProperties: false
      required: [providerKind, unit, comparator, threshold, allowedDispositions]
      properties:
        providerKind: { type: string, const: production_cycle_time }
        comparator: { type: string, enum: [less_than_or_equal, greater_than_or_equal, equal] }
        threshold: { type: string, pattern: "^-?[0-9]+(?:\\.[0-9]+)?$" }
        allowedDispositions: { $ref: "#/components/schemas/ProductionTransitionAllowedDispositions" }
        unit: { type: string, minLength: 1, maxLength: 32 }
    ProductionTransitionToolingStabilityRule:
      type: object
      additionalProperties: false
      required: [providerKind, unit, comparator, threshold, allowedDispositions]
      properties:
        providerKind: { type: string, const: tooling_stability }
        comparator: { type: string, enum: [less_than_or_equal, greater_than_or_equal, equal] }
        threshold: { type: string, pattern: "^-?[0-9]+(?:\\.[0-9]+)?$" }
        allowedDispositions: { $ref: "#/components/schemas/ProductionTransitionAllowedDispositions" }
        unit: { type: string, minLength: 1, maxLength: 32 }
    ProductionTransitionObservationSourceRules:
      type: array
      minItems: 5
      maxItems: 5
      prefixItems:
        - { $ref: "#/components/schemas/ProductionTransitionActualSopRule" }
        - { $ref: "#/components/schemas/ProductionTransitionCustomerComplaintRule" }
        - { $ref: "#/components/schemas/ProductionTransitionFirstBatchYieldRule" }
        - { $ref: "#/components/schemas/ProductionTransitionCycleTimeRule" }
        - { $ref: "#/components/schemas/ProductionTransitionToolingStabilityRule" }
      items: false
    ProductionTransitionPolicyDefinition:
      type: object
      additionalProperties: false
      description: Explicit no-default NPI technical configuration; it carries no provider actual, production acceptance, stability conclusion or G7 authority.
      required: [applicability, receivingGroups, acknowledgementSlots, handoverRequirements, observationSourceRules, observationWindowDays]
      properties:
        applicability: { $ref: "#/components/schemas/ProductionTransitionApplicability" }
        receivingGroups:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ProductionTransitionReceivingGroupDefinition" }
        acknowledgementSlots:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ProductionTransitionAcknowledgementSlotDefinition" }
        handoverRequirements:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ProductionTransitionHandoverObjectRequirement" }
        observationSourceRules:
          $ref: "#/components/schemas/ProductionTransitionObservationSourceRules"
        observationWindowDays: { type: integer, minimum: 1, maximum: 3650 }
    ProductionTransitionPolicyVersion:
      type: object
      additionalProperties: false
      description: Immutable after publication; metadata installs no production default row or Project binding.
      required: [schemaVersion, globalId, policyGlobalId, policyCode, policyVersion, versionKeyHash, optimisticVersion, title, publicationState, priorVersionRef, applicability, receivingGroups, acknowledgementSlots, handoverRequirements, unresolvedActionSelector, observationSourceRules, observationWindowDays, authorityBoundary, changedByUserId, changedAt, requestId, traceId, snapshotHash]
      properties:
        schemaVersion: { type: integer, const: 1 }
        globalId: { type: string, format: uuid }
        policyGlobalId: { type: string, format: uuid }
        policyCode: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$" }
        policyVersion: { type: integer, minimum: 1 }
        versionKeyHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
        optimisticVersion: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        publicationState: { type: string, enum: [draft, published] }
        priorVersionRef:
          oneOf: [{ $ref: "#/components/schemas/ProductionTransitionExactVersionReference" }, { type: "null" }]
        applicability: { $ref: "#/components/schemas/ProductionTransitionApplicability" }
        receivingGroups:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ProductionTransitionReceivingGroupDefinition" }
        acknowledgementSlots:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ProductionTransitionAcknowledgementSlotDefinition" }
        handoverRequirements:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ProductionTransitionHandoverObjectRequirement" }
        unresolvedActionSelector: { $ref: "#/components/schemas/ProductionTransitionUnresolvedActionSelector" }
        observationSourceRules:
          $ref: "#/components/schemas/ProductionTransitionObservationSourceRules"
        observationWindowDays: { type: integer, minimum: 1, maximum: 3650 }
        authorityBoundary: { type: string, const: npi_technical_configuration_only }
        changedByUserId: { type: string, format: email, maxLength: 254 }
        changedAt: { type: string, format: date-time }
        requestId: { type: string, format: uuid }
        traceId: { type: string, minLength: 8, maxLength: 128 }
        snapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
    ProductionTransitionPolicyCatalog:
      type: object
      additionalProperties: false
      required: [projectGlobalId, policies]
      properties:
        projectGlobalId: { type: string, format: uuid }
        policies:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ProductionTransitionPolicyVersion" }
    CreateProductionTransitionPolicy:
      type: object
      additionalProperties: false
      required: [policyCode, title, definition]
      properties:
        policyCode: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$" }
        title: { type: string, minLength: 1, maxLength: 200 }
        definition: { $ref: "#/components/schemas/ProductionTransitionPolicyDefinition" }
    EditProductionTransitionPolicy:
      type: object
      additionalProperties: false
      required: [expectedOptimisticVersion, title, definition]
      properties:
        expectedOptimisticVersion: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        definition: { $ref: "#/components/schemas/ProductionTransitionPolicyDefinition" }
    PublishProductionTransitionPolicy:
      type: object
      additionalProperties: false
      required: [expectedOptimisticVersion, expectedSnapshotHash]
      properties:
        expectedOptimisticVersion: { type: integer, minimum: 1 }
        expectedSnapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
    CreateNextProductionTransitionPolicyVersion:
      type: object
      additionalProperties: false
      required: [expectedPublishedVersion, expectedPublishedSnapshotHash]
      properties:
        expectedPublishedVersion: { type: integer, minimum: 1 }
        expectedPublishedSnapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
    ProductionTransitionSourceKind:
      type: string
      enum: [readiness_instance_revision, domain_work_item, released_document, release_baseline, file_revision, tooling_capacity_scenario, trial_defect_revision, trial_review_reference, trial_conclusion]
    ProductionTransitionExactVersionReference:
      type: object
      additionalProperties: false
      required: [globalId, version, snapshotHash]
      properties:
        globalId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        snapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
    ProductionTransitionUnresolvedActionSelector:
      type: object
      additionalProperties: false
      required: [mode, kinds]
      properties:
        mode: { type: string, const: all_non_terminal }
        kinds:
          type: array
          minItems: 4
          maxItems: 4
          prefixItems:
            - { type: string, const: action }
            - { type: string, const: decision_request }
            - { type: string, const: issue }
            - { type: string, const: risk }
          items: false
    ProductionTransitionExactSourceSelection:
      type: object
      additionalProperties: false
      description: Observation browser request submits only a closed kind, exact identity and expected version; server fixes usage, loads the canonical projection and computes its hash.
      required: [kind, globalId, expectedVersion]
      properties:
        kind: { $ref: "#/components/schemas/ProductionTransitionSourceKind" }
        globalId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
    ProductionTransitionManifestSourceSelection:
      type: object
      additionalProperties: false
      description: Handover browser request selects one published-policy requirement and exact source tuple; role, projection and hash remain server-owned.
      required: [requirementKey, kind, globalId, expectedVersion]
      properties:
        requirementKey: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$" }
        kind: { $ref: "#/components/schemas/ProductionTransitionSourceKind" }
        globalId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
    ProductionTransitionExactSourceReference:
      type: object
      additionalProperties: false
      description: Canonical handover manifest reference; requirementKey comes from the caller selection and role is injected from the exact published policy requirement.
      required: [requirementKey, kind, globalId, sourceVersion, snapshotHash, role]
      properties:
        requirementKey: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$" }
        kind: { $ref: "#/components/schemas/ProductionTransitionSourceKind" }
        globalId: { type: string, format: uuid }
        sourceVersion: { type: integer, minimum: 1 }
        snapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
        role: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$" }
    ProductionTransitionObservationSourceReference:
      type: object
      additionalProperties: false
      description: Canonical observation reference; usage, projection and hash are server-owned and it carries no handover requirement or manifest role.
      required: [kind, globalId, sourceVersion, snapshotHash, usage]
      properties:
        kind: { $ref: "#/components/schemas/ProductionTransitionSourceKind" }
        globalId: { type: string, format: uuid }
        sourceVersion: { type: integer, minimum: 1 }
        snapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
        usage: { type: string, enum: [context, retrospective] }
    ProductionTransitionSlotAssignmentSelection:
      type: object
      additionalProperties: false
      required: [slotKey, memberGlobalId, memberExpectedVersion, roleAssignmentGlobalId, roleExpectedVersion]
      properties:
        slotKey: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$" }
        memberGlobalId: { type: string, format: uuid }
        memberExpectedVersion: { type: integer, minimum: 1 }
        roleAssignmentGlobalId: { type: string, format: uuid }
        roleExpectedVersion: { type: integer, minimum: 1 }
    ProductionTransitionPolicyReferenceRequest:
      type: object
      additionalProperties: false
      required: [policyGlobalId, policyVersion, policySnapshotHash]
      properties:
        policyGlobalId: { type: string, format: uuid }
        policyVersion: { type: integer, minimum: 1 }
        policySnapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
    ProductionHandoverRequestContent:
      type: object
      additionalProperties: false
      required: [expectedProjectVersion, policy, slotAssignments, manifestSources, reason]
      properties:
        expectedProjectVersion: { type: integer, minimum: 1 }
        policy: { $ref: "#/components/schemas/ProductionTransitionPolicyReferenceRequest" }
        slotAssignments:
          type: array
          minItems: 2
          maxItems: 100
          items: { $ref: "#/components/schemas/ProductionTransitionSlotAssignmentSelection" }
        manifestSources:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/ProductionTransitionManifestSourceSelection" }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    CreateProductionHandoverPackage:
      allOf:
        - $ref: "#/components/schemas/ProductionHandoverRequestContent"
      unevaluatedProperties: false
    ReviseProductionHandoverPackage:
      type: object
      additionalProperties: false
      required: [expectedRevisionGlobalId, expectedSnapshotHash, content]
      properties:
        expectedRevisionGlobalId: { type: string, format: uuid }
        expectedSnapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
        content: { $ref: "#/components/schemas/ProductionHandoverRequestContent" }
    AcknowledgeProductionHandoverSlot:
      type: object
      additionalProperties: false
      description: Actor and time are session-derived; this request carries no proxy, signature, approval, fullyAcknowledged, Gate or production-acceptance value.
      required: [expectedRevisionGlobalId, expectedSnapshotHash, slotKey, intent]
      properties:
        expectedRevisionGlobalId: { type: string, format: uuid }
        expectedSnapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
        slotKey: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$" }
        intent: { type: string, const: acknowledge }
    ProductionTransitionProjectSnapshot:
      type: object
      additionalProperties: false
      required: [globalId, tenantId, optimisticVersion, businessCode, title, projectType, ownerUserId, targetSopDate, targetSopState, lifecycleState, templateRef, workPolicyRef, customerReferenceKeys]
      properties:
        globalId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1, maxLength: 128 }
        optimisticVersion: { type: integer, minimum: 1 }
        businessCode: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$" }
        title: { type: string, minLength: 1, maxLength: 200 }
        projectType: { type: string, enum: [customer_owned_tool, new_tool, tool_change] }
        ownerUserId: { type: string, format: email, maxLength: 254 }
        targetSopDate:
          description: Planned Project context only; never actual SOP.
          oneOf: [{ type: string, format: date }, { type: "null" }]
        targetSopState: { type: string, const: planned_only }
        lifecycleState: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,63}$" }
        templateRef: { $ref: "#/components/schemas/ProductionTransitionExactVersionReference" }
        workPolicyRef: { $ref: "#/components/schemas/ProductionTransitionExactVersionReference" }
        customerReferenceKeys:
          type: array
          maxItems: 1000
          items: { type: string, minLength: 1, maxLength: 256 }
    ProductionTransitionMemberSnapshot:
      type: object
      additionalProperties: false
      required: [globalId, tenantId, projectGlobalId, userId, effectiveFrom, effectiveTo, optimisticVersion]
      properties:
        globalId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1, maxLength: 128 }
        projectGlobalId: { type: string, format: uuid }
        userId: { type: string, format: email, maxLength: 254 }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { oneOf: [{ type: string, format: date }, { type: "null" }] }
        optimisticVersion: { type: integer, minimum: 1 }
    ProductionTransitionRoleSnapshot:
      type: object
      additionalProperties: false
      required: [globalId, tenantId, projectGlobalId, memberGlobalId, roleKey, effectiveFrom, effectiveTo, optimisticVersion]
      properties:
        globalId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1, maxLength: 128 }
        projectGlobalId: { type: string, format: uuid }
        memberGlobalId: { type: string, format: uuid }
        roleKey: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$" }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { oneOf: [{ type: string, format: date }, { type: "null" }] }
        optimisticVersion: { type: integer, minimum: 1 }
    ProductionTransitionFrozenSlot:
      type: object
      additionalProperties: false
      required: [slotKey, groupKey, direction, member, memberSnapshotHash, role, roleSnapshotHash]
      properties:
        slotKey: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$" }
        direction: { type: string, enum: [sender, receiver] }
        groupKey: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$" }
        member: { $ref: "#/components/schemas/ProductionTransitionMemberSnapshot" }
        memberSnapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
        role: { $ref: "#/components/schemas/ProductionTransitionRoleSnapshot" }
        roleSnapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
    ProductionTransitionUnresolvedWorkItemSnapshot:
      type: object
      additionalProperties: false
      required: [globalId, sourceVersion, snapshotHash, kind, state, ownerUserId, dueDate]
      properties:
        globalId: { type: string, format: uuid }
        sourceVersion: { type: integer, minimum: 1 }
        snapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
        kind: { type: string, enum: [action, decision_request, issue, risk] }
        state: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,63}$" }
        ownerUserId: { type: string, format: email, maxLength: 254 }
        dueDate: { type: string, format: date }
    HandoverAcknowledgement:
      type: object
      additionalProperties: false
      required: [schemaVersion, globalId, handoverGlobalId, packageRevisionGlobalId, packageVersion, packageSnapshotHash, slotKey, acknowledgementIntent, actorUserId, memberGlobalId, memberOptimisticVersion, memberSnapshotHash, roleGlobalId, roleOptimisticVersion, roleSnapshotHash, acknowledgedAt, requestId, traceId, snapshotHash]
      properties:
        schemaVersion: { type: integer, const: 1 }
        globalId: { type: string, format: uuid }
        handoverGlobalId: { type: string, format: uuid }
        packageRevisionGlobalId: { type: string, format: uuid }
        packageVersion: { type: integer, minimum: 1 }
        packageSnapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
        slotKey: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,127}$" }
        acknowledgementIntent: { type: string, const: acknowledge_exact_package_slot }
        actorUserId: { type: string, format: email, maxLength: 254 }
        memberGlobalId: { type: string, format: uuid }
        memberOptimisticVersion: { type: integer, minimum: 1 }
        memberSnapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
        roleGlobalId: { type: string, format: uuid }
        roleOptimisticVersion: { type: integer, minimum: 1 }
        roleSnapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
        acknowledgedAt: { type: string, format: date-time }
        requestId: { type: string, format: uuid }
        traceId: { type: string, minLength: 8, maxLength: 128 }
        snapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
    HandoverPackageRevision:
      type: object
      additionalProperties: false
      description: Immutable canonical NPI technical handover snapshot; acknowledgement projections never contribute to its snapshotHash.
      required: [schemaVersion, globalId, handoverGlobalId, handoverVersion, versionKeyHash, predecessorGlobalId, predecessorSnapshotHash, tenantId, project, projectSnapshotHash, policyRef, readinessRef, slots, manifest, unresolvedActionSelector, unresolvedActions, reason, createdByUserId, createdAt, requestId, traceId, snapshotHash]
      properties:
        schemaVersion: { type: integer, const: 1 }
        globalId: { type: string, format: uuid }
        handoverGlobalId: { type: string, format: uuid }
        handoverVersion: { type: integer, minimum: 1 }
        versionKeyHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
        predecessorGlobalId: { oneOf: [{ type: string, format: uuid }, { type: "null" }] }
        predecessorSnapshotHash: { oneOf: [{ $ref: "#/components/schemas/ProductionTransitionSha256" }, { type: "null" }] }
        tenantId: { type: string, minLength: 1, maxLength: 128 }
        project: { $ref: "#/components/schemas/ProductionTransitionProjectSnapshot" }
        projectSnapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
        policyRef: { $ref: "#/components/schemas/ProductionTransitionExactVersionReference" }
        readinessRef:
          oneOf: [{ $ref: "#/components/schemas/ProductionTransitionExactVersionReference" }, { type: "null" }]
        slots:
          type: array
          minItems: 2
          maxItems: 100
          items: { $ref: "#/components/schemas/ProductionTransitionFrozenSlot" }
        manifest:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ProductionTransitionExactSourceReference" }
        unresolvedActionSelector: { $ref: "#/components/schemas/ProductionTransitionUnresolvedActionSelector" }
        unresolvedActions:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/ProductionTransitionUnresolvedWorkItemSnapshot" }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        createdByUserId: { type: string, format: email, maxLength: 254 }
        createdAt: { type: string, format: date-time }
        requestId: { type: string, format: uuid }
        traceId: { type: string, minLength: 8, maxLength: 128 }
        snapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
    HandoverPackageView:
      type: object
      additionalProperties: false
      description: Query-only wrapper; fullyAcknowledged is derived from immutable acknowledgement facts and never stored in or hashed into revision.
      required: [revision, acknowledgements, fullyAcknowledged]
      properties:
        revision: { $ref: "#/components/schemas/HandoverPackageRevision" }
        acknowledgements:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/HandoverAcknowledgement" }
        fullyAcknowledged:
          type: boolean
          readOnly: true
          description: Query-time derivation only; not approval, signature, production acceptance, Gate result or G7 closure.
    ProductionTransitionExternalUnavailableProvider:
      oneOf:
        - $ref: "#/components/schemas/ProductionTransitionActualSopUnavailable"
        - $ref: "#/components/schemas/ProductionTransitionFirstBatchYieldUnavailable"
        - $ref: "#/components/schemas/ProductionTransitionCustomerComplaintUnavailable"
        - $ref: "#/components/schemas/ProductionTransitionCycleTimeUnavailable"
        - $ref: "#/components/schemas/ProductionTransitionToolingStabilityUnavailable"
    ProductionTransitionActualSopUnavailable:
      type: object
      additionalProperties: false
      required: [kind, state, reasonCode, sourceIdentity, observedAt, value, unit]
      properties:
        kind: { type: string, const: actual_sop }
        state: { type: string, const: unavailable }
        reasonCode: { type: string, const: actual_sop_provider_unavailable }
        sourceIdentity: { type: "null" }
        observedAt: { type: "null" }
        value: { type: "null" }
        unit: { type: "null" }
    ProductionTransitionFirstBatchYieldUnavailable:
      type: object
      additionalProperties: false
      required: [kind, state, reasonCode, sourceIdentity, observedAt, value, unit]
      properties:
        kind: { type: string, const: first_batch_yield }
        state: { type: string, const: unavailable }
        reasonCode: { type: string, const: first_batch_yield_provider_unavailable }
        sourceIdentity: { type: "null" }
        observedAt: { type: "null" }
        value: { type: "null" }
        unit: { type: "null" }
    ProductionTransitionCustomerComplaintUnavailable:
      type: object
      additionalProperties: false
      required: [kind, state, reasonCode, sourceIdentity, observedAt, value, unit]
      properties:
        kind: { type: string, const: customer_complaint }
        state: { type: string, const: unavailable }
        reasonCode: { type: string, const: customer_complaint_provider_unavailable }
        sourceIdentity: { type: "null" }
        observedAt: { type: "null" }
        value: { type: "null" }
        unit: { type: "null" }
    ProductionTransitionCycleTimeUnavailable:
      type: object
      additionalProperties: false
      required: [kind, state, reasonCode, sourceIdentity, observedAt, value, unit]
      properties:
        kind: { type: string, const: production_cycle_time }
        state: { type: string, const: unavailable }
        reasonCode: { type: string, const: production_cycle_time_provider_unavailable }
        sourceIdentity: { type: "null" }
        observedAt: { type: "null" }
        value: { type: "null" }
        unit: { type: "null" }
    ProductionTransitionToolingStabilityUnavailable:
      type: object
      additionalProperties: false
      required: [kind, state, reasonCode, sourceIdentity, observedAt, value, unit]
      properties:
        kind: { type: string, const: tooling_stability }
        state: { type: string, const: unavailable }
        reasonCode: { type: string, const: tooling_stability_provider_unavailable }
        sourceIdentity: { type: "null" }
        observedAt: { type: "null" }
        value: { type: "null" }
        unit: { type: "null" }
    ProductionTransitionExternalUnavailableProviders:
      type: array
      minItems: 5
      maxItems: 5
      prefixItems:
        - { $ref: "#/components/schemas/ProductionTransitionActualSopUnavailable" }
        - { $ref: "#/components/schemas/ProductionTransitionFirstBatchYieldUnavailable" }
        - { $ref: "#/components/schemas/ProductionTransitionCustomerComplaintUnavailable" }
        - { $ref: "#/components/schemas/ProductionTransitionCycleTimeUnavailable" }
        - { $ref: "#/components/schemas/ProductionTransitionToolingStabilityUnavailable" }
      items: false
    ProductionTransitionHandoverReferenceRequest:
      type: object
      additionalProperties: false
      required: [handoverGlobalId, handoverVersion, handoverRevisionGlobalId, handoverSnapshotHash]
      properties:
        handoverGlobalId: { type: string, format: uuid }
        handoverVersion: { type: integer, minimum: 1 }
        handoverRevisionGlobalId: { type: string, format: uuid }
        handoverSnapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
    CreateObservationPeriod:
      type: object
      additionalProperties: false
      description: Mandatory providers are injected server-side; no actual SOP, observed date, metric identity/value/status/score/pass flag or conclusion is accepted.
      required: [expectedProjectVersion, policy, handover, contextSources, retrospectiveSources, retrospectiveNote, reason]
      properties:
        expectedProjectVersion: { type: integer, minimum: 1 }
        policy: { $ref: "#/components/schemas/ProductionTransitionPolicyReferenceRequest" }
        handover:
          oneOf: [{ $ref: "#/components/schemas/ProductionTransitionHandoverReferenceRequest" }, { type: "null" }]
        contextSources:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ProductionTransitionExactSourceSelection" }
        retrospectiveSources:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ProductionTransitionExactSourceSelection" }
        retrospectiveNote:
          oneOf: [{ type: string, maxLength: 4000 }, { type: "null" }]
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ReviseObservationPeriod:
      type: object
      additionalProperties: false
      description: Exact unique-tip successor request; external provider truth and disposition remain server-derived.
      required: [expectedRevisionGlobalId, expectedSnapshotHash, contextSources, retrospectiveSources, retrospectiveNote, reason]
      properties:
        expectedRevisionGlobalId: { type: string, format: uuid }
        expectedSnapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
        contextSources:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ProductionTransitionExactSourceSelection" }
        retrospectiveSources:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ProductionTransitionExactSourceSelection" }
        retrospectiveNote:
          oneOf: [{ type: string, maxLength: 4000 }, { type: "null" }]
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ObservationPeriodRevision:
      type: object
      additionalProperties: false
      description: Independent immutable NPI observation/review snapshot; external actuals remain unavailable and no formal production stability is asserted.
      required: [schemaVersion, globalId, observationGlobalId, observationVersion, versionKeyHash, predecessorGlobalId, predecessorSnapshotHash, tenantId, project, projectSnapshotHash, policyRef, handoverPackageRef, contextReferences, retrospectiveReferences, providers, observedStartDate, observedEndDate, observationState, technicalDisposition, authorityBoundary, retrospectiveNote, reason, createdByUserId, createdAt, requestId, traceId, snapshotHash]
      properties:
        schemaVersion: { type: integer, const: 1 }
        globalId: { type: string, format: uuid }
        observationGlobalId: { type: string, format: uuid }
        observationVersion: { type: integer, minimum: 1 }
        versionKeyHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
        predecessorGlobalId: { oneOf: [{ type: string, format: uuid }, { type: "null" }] }
        predecessorSnapshotHash: { oneOf: [{ $ref: "#/components/schemas/ProductionTransitionSha256" }, { type: "null" }] }
        tenantId: { type: string, minLength: 1, maxLength: 128 }
        project: { $ref: "#/components/schemas/ProductionTransitionProjectSnapshot" }
        projectSnapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
        policyRef: { $ref: "#/components/schemas/ProductionTransitionExactVersionReference" }
        handoverPackageRef:
          oneOf: [{ $ref: "#/components/schemas/ProductionTransitionExactVersionReference" }, { type: "null" }]
        contextReferences:
          type: array
          maxItems: 1000
          items:
            allOf:
              - { $ref: "#/components/schemas/ProductionTransitionObservationSourceReference" }
              - properties:
                  usage: { type: string, const: context }
        retrospectiveReferences:
          type: array
          maxItems: 1000
          items:
            allOf:
              - { $ref: "#/components/schemas/ProductionTransitionObservationSourceReference" }
              - properties:
                  usage: { type: string, const: retrospective }
        providers:
          $ref: "#/components/schemas/ProductionTransitionExternalUnavailableProviders"
        observedStartDate: { type: "null" }
        observedEndDate: { type: "null" }
        observationState: { type: string, const: not_evaluable }
        technicalDisposition:
          type: string
          const: not_evaluable
          description: Server-derived while any mandatory provider is unavailable; never success, stable, approval or Gate truth.
        authorityBoundary: { type: string, const: technical_observation_only }
        retrospectiveNote:
          oneOf: [{ type: string, maxLength: 4000 }, { type: "null" }]
        reason: { type: string, minLength: 1, maxLength: 1000 }
        createdByUserId: { type: string, format: email, maxLength: 254 }
        createdAt: { type: string, format: date-time }
        requestId: { type: string, format: uuid }
        traceId: { type: string, minLength: 8, maxLength: 128 }
        snapshotHash: { $ref: "#/components/schemas/ProductionTransitionSha256" }
    ProductionHandoverCommandResponse:
      type: object
      additionalProperties: false
      required: [projectGlobalId, handoverPackage]
      properties:
        projectGlobalId: { type: string, format: uuid }
        handoverPackage: { $ref: "#/components/schemas/HandoverPackageRevision" }
    ProductionHandoverAcknowledgementCommandResponse:
      type: object
      additionalProperties: false
      required: [projectGlobalId, handoverPackage, acknowledgement]
      properties:
        projectGlobalId: { type: string, format: uuid }
        handoverPackage: { $ref: "#/components/schemas/HandoverPackageRevision" }
        acknowledgement: { $ref: "#/components/schemas/HandoverAcknowledgement" }
    ObservationPeriodCommandResponse:
      type: object
      additionalProperties: false
      required: [projectGlobalId, observationPeriod]
      properties:
        projectGlobalId: { type: string, format: uuid }
        observationPeriod: { $ref: "#/components/schemas/ObservationPeriodRevision" }
    ProductionTransitionPermissions:
      type: object
      additionalProperties: false
      required: [canManagePolicies, canCreateHandover, canReviseHandover, canAcknowledgeSlots, canCreateObservation, canReviseObservation]
      properties:
        canManagePolicies: { type: boolean }
        canCreateHandover: { type: boolean }
        canReviseHandover: { type: boolean }
        canAcknowledgeSlots:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 128 }
        canCreateObservation: { type: boolean }
        canReviseObservation: { type: boolean }
    ProductionTransitionWorkspace:
      type: object
      additionalProperties: false
      description: Exact independent histories; no Gate, Project lifecycle, Work Item, Tooling, ERP, event or external projection mutation occurs.
      required: [projectGlobalId, currentHandover, handoverHistory, currentObservation, observationHistory, unavailableProviders, permissions]
      properties:
        projectGlobalId: { type: string, format: uuid }
        currentHandover:
          oneOf: [{ $ref: "#/components/schemas/HandoverPackageView" }, { type: "null" }]
        handoverHistory:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/HandoverPackageView" }
        currentObservation:
          oneOf: [{ $ref: "#/components/schemas/ObservationPeriodRevision" }, { type: "null" }]
        observationHistory:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ObservationPeriodRevision" }
        unavailableProviders:
          $ref: "#/components/schemas/ProductionTransitionExternalUnavailableProviders"
        permissions: { $ref: "#/components/schemas/ProductionTransitionPermissions" }
    ProblemDetails:
      type: object
      additionalProperties: false
      description: Closed RFC 9457-style business error with stable NPI extensions
      required: [type, title, status, code, traceId, retryable]
      properties:
        type:
          { type: string, format: uri-reference, minLength: 1, maxLength: 2048 }
        title: { type: string, minLength: 1, maxLength: 280 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, maxLength: 4000 }
        instance:
          { type: string, format: uri-reference, minLength: 1, maxLength: 2048 }
        code:
          {
            type: string,
            minLength: 3,
            maxLength: 100,
            pattern: "^[A-Z][A-Z0-9_]*$",
          }
        traceId:
          {
            type: string,
            minLength: 8,
            maxLength: 128,
            pattern: "^[A-Za-z0-9._:-]+$",
          }
        retryable: { type: boolean }
        fieldErrors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [path, message]
            properties:
              path: { type: string, minLength: 1, maxLength: 500 }
              message: { type: string, minLength: 1, maxLength: 1000 }
