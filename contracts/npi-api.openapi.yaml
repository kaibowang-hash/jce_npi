      properties:
        sourceSystem: { type: string, const: ERPNEXT }
        editableIn: { type: string, const: ERPNEXT }
        state: { type: string, const: unavailable }
        shotCount: { $ref: "#/components/schemas/ToolingEngineeringUnavailableField" }
        calibration: { $ref: "#/components/schemas/ToolingEngineeringUnavailableField" }
        maintenance: { $ref: "#/components/schemas/ToolingEngineeringUnavailableField" }
        healthScore: { $ref: "#/components/schemas/ToolingEngineeringUnavailableField" }
    CommandResult:
      type: object
      required: [globalId, version, status]
      properties:
        globalId: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string }
        operationId: { type: string, format: uuid }
    ProblemDetails:
      type: object
      additionalProperties: false
      description: Closed RFC 9457-style business error with stable NPI extensions
      required: [type, title, status, code, traceId, retryable]
      properties:
        type:
          { type: string, format: uri-reference, minLength: 1, maxLength: 2048 }
        title: { type: string, minLength: 1, maxLength: 280 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, maxLength: 4000 }
        instance:
          { type: string, format: uri-reference, minLength: 1, maxLength: 2048 }
        code:
          {
            type: string,
            minLength: 3,
            maxLength: 100,
            pattern: "^[A-Z][A-Z0-9_]*$",
          }
        traceId:
          {
            type: string,
            minLength: 8,
            maxLength: 128,
            pattern: "^[A-Za-z0-9._:-]+$",
          }
        retryable: { type: boolean }
        fieldErrors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [path, message]
            properties:
              path: { type: string, minLength: 1, maxLength: 500 }
              message: { type: string, minLength: 1, maxLength: 1000 }
