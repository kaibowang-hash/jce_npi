      type: object
      additionalProperties: false
      required: [lineKey, engineeringItemId, description, quantity, engineeringUom]
      properties:
        lineKey: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
