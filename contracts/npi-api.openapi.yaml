          releaseEventGlobalId,
          releaseEventHash,
          ebomPolicyGlobalId,
          ebomPolicyVersion,
          ebomPolicySnapshotHash,
          approvalEvidenceIds,
          releasedAt,
        ]
      properties:
        projectGlobalId: { type: string, format: uuid }
        ebomGlobalId: { type: string, format: uuid }
        ebomVersion: { type: integer, minimum: 1 }
        revisionGlobalId: { type: string, format: uuid }
        revisionNumber: { type: integer, minimum: 1 }
        revisionSnapshotHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        lifecycleVersion: { type: integer, minimum: 1 }
        releaseEventGlobalId: { type: string, format: uuid }
        releaseEventHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        ebomPolicyGlobalId: { type: string, format: uuid }
        ebomPolicyVersion: { type: integer, minimum: 1 }
        ebomPolicySnapshotHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        approvalEvidenceIds:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: { type: string, format: uuid }
        releasedAt: { type: string, format: date-time }
    EngineeringBomPublishLineInput:
      type: object
      additionalProperties: false
      required:
        [
          globalId,
          lineKey,
          parentLineKey,
          engineeringItemId,
          description,
          quantity,
          engineeringUom,
          alternateForLineKey,
          alternateGroupKey,
          effectivityStart,
          effectivityEnd,
          attributes,
          lineHash,
        ]
      properties:
        globalId: { type: string, format: uuid }
        lineKey: { type: string, minLength: 1, maxLength: 64 }
        parentLineKey: { type: [string, "null"], maxLength: 64 }
        engineeringItemId: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, minLength: 1, maxLength: 280 }
        quantity: { type: string, pattern: "^[0-9]+(?:\\.[0-9]+)?$", maxLength: 64 }
        engineeringUom: { type: string, minLength: 1, maxLength: 16 }
        alternateForLineKey: { type: [string, "null"], maxLength: 64 }
        alternateGroupKey: { type: [string, "null"], maxLength: 64 }
        effectivityStart: { type: [string, "null"], format: date }
        effectivityEnd: { type: [string, "null"], format: date }
        attributes:
          type: object
          propertyNames: { pattern: "^[a-z][a-z0-9_.-]{0,63}$" }
          additionalProperties: { type: string, maxLength: 280 }
          maxProperties: 50
        lineHash: { type: string, pattern: "^[a-f0-9]{64}$" }
    EngineeringBomPublishMappingObservation:
      type: object
      additionalProperties: false
      required:
        [
          state,
          version,
          formalItemCode,
          formalMbomId,
          targetVersion,
          observedAt,
        ]
      properties:
        state: { type: string, enum: [unmapped, current, stale, conflict] }
        version: { type: integer, minimum: 0 }
        formalItemCode: { type: "null" }
        formalMbomId: { type: "null" }
        targetVersion: { type: "null" }
        observedAt: { type: [string, "null"], format: date-time }
    EngineeringBomPublishNodeResult:
      type: object
      additionalProperties: false
      required:
        [
          globalId,
          nodeGlobalId,
          nodeInputHash,
          attemptNumber,
          state,
          faultKind,
          futureRetryDirective,
          futureRetryable,
          reconciliationRequired,
          retryAfterRequired,
          phase5DispatchAllowed,
          formalItemCode,
          formalMbomId,
          targetVersion,
          occurredAt,
          resultHash,
        ]
      properties:
        globalId: { type: string, format: uuid }
        nodeGlobalId: { type: string, format: uuid }
        nodeInputHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        attemptNumber: { type: integer, minimum: 0 }
        state:
          type: string
          enum:
            [
              validated,
              queued,
              processing,
              succeeded,
              failed_retryable,
              failed_final,
              uncertain_after_timeout,
              blocked_mapping,
              target_unavailable,
            ]
        faultKind:
          type: [string, "null"]
          enum:
            [
              duplicate_request,
              payload_conflict,
              timeout_after_possible_commit,
              rate_limited,
              target_server_error,
              business_validation,
              partial_node_success,
              stale_mapping,
              target_unavailable,
              restart_replay,
              null,
            ]
        futureRetryDirective:
          type: string
          enum:
            [
              none,
              replay_sealed_response,
              reject_payload_conflict,
              reconcile_before_retry,
              retry_after,
              retry_same_idempotency,
              manual_correction,
              retry_failed_nodes_only,
              resolve_mapping,
              replay_original_request,
            ]
        futureRetryable: { type: boolean }
        reconciliationRequired: { type: boolean }
        retryAfterRequired: { type: boolean }
        phase5DispatchAllowed: { type: boolean, const: false }
        formalItemCode: { type: "null" }
        formalMbomId: { type: "null" }
        targetVersion: { type: "null" }
        occurredAt: { type: string, format: date-time }
        resultHash: { type: string, pattern: "^[a-f0-9]{64}$" }
    EngineeringBomPublishNode:
      type: object
      additionalProperties: false
      required:
        [globalId, line, mapping, operations, resultState, inputHash, results]
      properties:
        globalId: { type: string, format: uuid }
        line: { $ref: "#/components/schemas/EngineeringBomPublishLineInput" }
        mapping:
          $ref: "#/components/schemas/EngineeringBomPublishMappingObservation"
        operations:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
              [create_item, update_item_engineering_fields, create_or_update_mbom]
        resultState:
          type: string
          enum:
            [
              validated,
              queued,
              processing,
              succeeded,
              failed_retryable,
              failed_final,
              uncertain_after_timeout,
              blocked_mapping,
              target_unavailable,
            ]
        inputHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        results:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/EngineeringBomPublishNodeResult"
    EngineeringBomPublishCapabilities:
      type: object
      additionalProperties: false
      required: [view, create, dispatch, retry, reconcile]
      properties:
        view: { type: boolean }
        create: { type: boolean }
        dispatch: { type: boolean, const: false }
        retry: { type: boolean, const: false }
        reconcile: { type: boolean, const: false }
    EngineeringBomPublishRequest:
      type: object
      additionalProperties: false
      required:
        [
          globalId,
          operation,
          apiVersion,
          policy,
          releasedEbom,
          targetMode,
          state,
          dispatchAllowed,
          actorUserId,
          requestId,
          traceId,
          payloadHash,
          ownedFields,
          nodes,
          capabilities,
          createdAt,
        ]
      properties:
        globalId: { type: string, format: uuid }
        operation: { type: string, const: publish_released_ebom_item_mbom }
        apiVersion: { type: string, const: npi.erp-publish.v1 }
        policy:
          $ref: "#/components/schemas/EngineeringBomPublishPolicyReference"
        releasedEbom:
          $ref: "#/components/schemas/ReleasedEngineeringBomPublishEvidence"
        targetMode: { type: string, const: mock }
        state: { type: string, enum: [validated, manual_intervention] }
        dispatchAllowed: { type: boolean, const: false }
        actorUserId: { type: string, minLength: 1, maxLength: 254 }
        requestId: { type: string, format: uuid }
        traceId:
          { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
        payloadHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        ownedFields:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            enum:
              [
                engineering_item_id,
                engineering_description,
                ebom_hierarchy,
                engineering_quantity,
                engineering_uom,
                alternates,
                effectivity,
                engineering_attributes,
              ]
        nodes:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/EngineeringBomPublishNode" }
        capabilities:
          $ref: "#/components/schemas/EngineeringBomPublishCapabilities"
        createdAt: { type: string, format: date-time }
    EngineeringBomPublishPermissions:
      type: object
      additionalProperties: false
      required: [view, create]
      properties:
        view: { type: boolean }
        create: { type: boolean }
    EngineeringBomPublishRequestList:
      type: object
      additionalProperties: false
      required: [project, ebom, revision, permissions, policies, items]
