components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sid
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes:
            npi.user: Use NPI One
            npi.admin: Administer NPI One
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      description: Immutable Engineering Project global_id; never a mutable business code
      schema: { type: string, format: uuid }
    GateId:
      in: path
      name: gateId
      required: true
      schema: { type: string, format: uuid }
    ReviewCycleId:
      in: path
      name: cycleId
      required: true
      description: Immutable Gate Review Cycle global_id
      schema: { type: string, format: uuid }
    ReviewExceptionId:
      in: path
      name: exceptionId
      required: true
      description: Immutable Gate Review Exception global_id
      schema: { type: string, format: uuid }
    ToolingId:
      in: path
      name: toolingId
      required: true
      schema: { type: string, format: uuid }
    TrialId:
      in: path
      name: trialId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 255
        pattern: "^[!-~]{16,255}$"
    RequestId:
      in: header
      name: X-Request-ID
      required: true
      description: Caller-generated UUID used for request, audit, and support correlation
      schema: { type: string, format: uuid }
    CsrfToken:
      in: header
      name: X-Frappe-CSRF-Token
      required: true
      description: Current Frappe session CSRF token returned by SessionBootstrap
      schema: { type: string, minLength: 32, maxLength: 128 }
  responses:
    Error:
      description: Problem response for an otherwise undocumented error status
      headers:
        X-Trace-ID:
          description: Stable trace identifier matching ProblemDetails traceId
          schema:
            {
              type: string,
              minLength: 8,
              maxLength: 128,
              pattern: "^[A-Za-z0-9._:-]+$",
            }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    BadRequest:
      description: The request syntax, headers, or JSON representation is malformed
      headers:
        X-Request-ID:
          description: Request identifier echoed for audit and support correlation
          required: true
          schema: { type: string, format: uuid }
        X-Trace-ID:
          description: Stable trace identifier matching ProblemDetails traceId
          required: true
          schema:
            {
              type: string,
              minLength: 8,
              maxLength: 128,
              pattern: "^[A-Za-z0-9._:-]+$",
            }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    AuthenticationError:
      description: Authentication is required or no longer valid
      headers:
        X-Request-ID:
          description: Request identifier echoed for audit and support correlation
          required: true
          schema: { type: string, format: uuid }
        X-Trace-ID:
          description: Stable trace identifier matching ProblemDetails traceId
          required: true
          schema:
            {
              type: string,
              minLength: 8,
              maxLength: 128,
              pattern: "^[A-Za-z0-9._:-]+$",
            }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    PermissionError:
      description: The authenticated principal is not permitted to access the tenant, Project, or command
      headers:
        X-Request-ID:
          description: Request identifier echoed for audit and support correlation
          required: true
          schema: { type: string, format: uuid }
        X-Trace-ID:
          description: Stable trace identifier matching ProblemDetails traceId
          required: true
          schema:
            {
              type: string,
              minLength: 8,
              maxLength: 128,
              pattern: "^[A-Za-z0-9._:-]+$",
            }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFoundError:
      description: The requested Project is unavailable without revealing another tenant's object existence
      headers:
        X-Request-ID:
          description: Request identifier echoed for audit and support correlation
          required: true
          schema: { type: string, format: uuid }
        X-Trace-ID:
          description: Stable trace identifier matching ProblemDetails traceId
          required: true
          schema:
            {
              type: string,
              minLength: 8,
              maxLength: 128,
              pattern: "^[A-Za-z0-9._:-]+$",
            }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Conflict:
      description: Business code, idempotency payload, version, or state conflict
      headers:
        X-Trace-ID:
          description: Stable trace identifier matching ProblemDetails traceId
          schema:
            {
              type: string,
              minLength: 8,
              maxLength: 128,
              pattern: "^[A-Za-z0-9._:-]+$",
            }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    ValidationError:
      description: Business validation failed
      headers:
        X-Trace-ID:
          description: Stable trace identifier matching ProblemDetails traceId
          schema:
            {
              type: string,
              minLength: 8,
