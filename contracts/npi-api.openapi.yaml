          items: { type: string, minLength: 1, maxLength: 64 }
        templateRef:
          type: object
          additionalProperties: false
          required: [globalId, version, snapshotHash]
          properties:
            globalId: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            snapshotHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        createdBy:
          type: string
          minLength: 1
          maxLength: 254
          description: Authenticated Frappe actor identity; Administrator is valid
        createdAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        target:
          type: object
          additionalProperties: false
          required: [kind, projectId, learningId]
          properties:
            kind: { type: string, const: project_learning }
            projectId: { type: string, format: uuid }
            learningId: { type: string, format: uuid }
    ProjectLearningPage:
      type: object
      additionalProperties: false
      required: [projectId, items, permissions]
      properties:
        projectId: { type: string, format: uuid }
        items:
          type: array
