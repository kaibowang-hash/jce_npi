        globalId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        snapshotHash: { type: string, pattern: "^[a-f0-9]{64}$" }
    EngineeringBomPolicyOption:
      type: object
      additionalProperties: false
      required:
        [
          globalId,
          version,
          snapshotHash,
          key,
          title,
          syntheticNamespace,
          quantityScale,
          maximumNodes,
          engineeringUoms,
          attributeKeys,
        ]
