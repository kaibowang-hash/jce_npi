                - properties:
                    viewId: { const: all }
            - allOf:
                - { $ref: "#/components/schemas/MyWorkGridViewPreference" }
                - properties:
                    viewId: { const: today }
            - allOf:
                - { $ref: "#/components/schemas/MyWorkGridViewPreference" }
                - properties:
                    viewId: { const: overdue }
            - allOf:
                - { $ref: "#/components/schemas/MyWorkGridViewPreference" }
                - properties:
                    viewId: { const: approvals }
            - allOf:
                - { $ref: "#/components/schemas/MyWorkGridViewPreference" }
                - properties:
                    viewId: { const: blockers }
            - allOf:
                - { $ref: "#/components/schemas/MyWorkGridViewPreference" }
                - properties:
                    viewId: { const: waiting }
            - allOf:
                - { $ref: "#/components/schemas/MyWorkGridViewPreference" }
