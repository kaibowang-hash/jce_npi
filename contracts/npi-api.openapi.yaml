    ToolingCapacityInputProvenance:
      type: object
      additionalProperties: false
      required: [kind, globalId, snapshotHash]
      properties:
        kind: { type: string, enum: [customer_standard, tooling_revision, tooling_applicability, tooling_set_selection, scenario_assumption] }
        globalId: { type: [string, "null"], format: uuid }
        snapshotHash: { type: string, pattern: "^[a-f0-9]{64}$" }
    ToolingCapacityLineInput:
      type: object
      additionalProperties: false
      required: [globalId, partRevisionGlobalId, partRevisionSnapshotHash, applicabilityGlobalId, applicabilitySnapshotHash, availableHoursPerDay, workingDaysPerMonth, oeeRatio, yieldRatio, cycleSeconds, cavityCount, usagePerAssembly, effectiveSetCount, selectedToolingSetGlobalIds, cycleProvenance, cavityProvenance, usageProvenance, setProvenance]
      properties:
        globalId: { type: string, format: uuid }
        partRevisionGlobalId: { type: string, format: uuid }
        partRevisionSnapshotHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        applicabilityGlobalId: { type: string, format: uuid }
        applicabilitySnapshotHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        availableHoursPerDay: { type: string, pattern: "^[0-9]+(?:[.][0-9]+)?$" }
        workingDaysPerMonth: { type: integer, minimum: 1, maximum: 31 }
        oeeRatio: { type: string, pattern: "^(?:0(?:[.][0-9]+)?|1(?:[.]0+)?)$" }
        yieldRatio: { type: string, pattern: "^(?:0(?:[.][0-9]+)?|1(?:[.]0+)?)$" }
        cycleSeconds: { type: string, pattern: "^[0-9]+(?:[.][0-9]+)?$" }
        cavityCount: { type: integer, minimum: 1 }
        usagePerAssembly: { type: string, pattern: "^[0-9]+(?:[.][0-9]+)?$" }
        effectiveSetCount: { type: integer, minimum: 0 }
        selectedToolingSetGlobalIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        cycleProvenance: { $ref: "#/components/schemas/ToolingCapacityInputProvenance" }
        cavityProvenance: { $ref: "#/components/schemas/ToolingCapacityInputProvenance" }
        usageProvenance: { $ref: "#/components/schemas/ToolingCapacityInputProvenance" }
        setProvenance: { $ref: "#/components/schemas/ToolingCapacityInputProvenance" }
    ToolingCapacityLineResult:
      type: object
      additionalProperties: false
      required: [globalId, partsPerDay, partsPerMonth, assemblyUnitsPerDay, assemblyUnitsPerMonth]
      properties:
        globalId: { type: string, format: uuid }
        partsPerDay: { type: string, pattern: "^[0-9]+[.][0-9]{6}$" }
        partsPerMonth: { type: string, pattern: "^[0-9]+[.][0-9]{6}$" }
        assemblyUnitsPerDay: { type: string, pattern: "^[0-9]+[.][0-9]{6}$" }
        assemblyUnitsPerMonth: { type: string, pattern: "^[0-9]+[.][0-9]{6}$" }
    ToolingCapacityScenarioResult:
      type: object
      additionalProperties: false
      description: >
        capacity.v1 computes parts_per_day as available_hours_per_day times
        3600 divided by cycle_seconds times oee_ratio times yield_ratio times
        cavity_count times effective_set_count; parts_per_month multiplies by
        working_days_per_month; assembly_units_per_day and
        assembly_units_per_month divide the matching part result by
        usage_per_assembly; scenario capacity is the minimum line assembly
        units per month and gap is the maximum of target minus scenario
        capacity and zero. Every output uses decimal-6-half-even.
      required: [formulaVersion, roundingRule, lineResults, scenarioAssemblyUnitsPerMonth, bottleneckLineGlobalIds, gap]
      properties:
        formulaVersion: { type: string, const: capacity.v1 }
        roundingRule: { type: string, const: decimal-6-half-even }
        lineResults:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ToolingCapacityLineResult" }
        scenarioAssemblyUnitsPerMonth: { type: string, pattern: "^[0-9]+[.][0-9]{6}$" }
        bottleneckLineGlobalIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        gap: { type: string, pattern: "^[0-9]+[.][0-9]{6}$" }
    ToolingCapacityScenarioRevision:
      type: object
      additionalProperties: false
      required: [schemaVersion, globalId, scenarioGlobalId, tenantId, projectGlobalId, toolingMasterGlobalId, scenarioVersion, predecessorGlobalId, predecessorSnapshotHash, title, effectiveFrom, targetMonthlyAssemblyUnits, formulaVersion, roundingRule, lines, result, reason, createdByUserId, createdAt, requestId, traceId, versionKeyHash, snapshotHash]
      properties:
        schemaVersion: { type: integer, const: 1 }
        globalId: { type: string, format: uuid }
        scenarioGlobalId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1, maxLength: 128 }
        projectGlobalId: { type: string, format: uuid }
        toolingMasterGlobalId: { type: string, format: uuid }
        scenarioVersion: { type: integer, minimum: 1 }
        predecessorGlobalId: { type: [string, "null"], format: uuid }
        predecessorSnapshotHash: { type: [string, "null"], pattern: "^[a-f0-9]{64}$" }
        title: { type: string, minLength: 1, maxLength: 255 }
        effectiveFrom: { type: string, format: date }
        targetMonthlyAssemblyUnits: { type: string, pattern: "^[0-9]+(?:[.][0-9]+)?$" }
        formulaVersion: { type: string, const: capacity.v1 }
        roundingRule: { type: string, const: decimal-6-half-even }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ToolingCapacityLineInput" }
        result:
          allOf:
            - { $ref: "#/components/schemas/ToolingCapacityScenarioResult" }
          readOnly: true
          description: Deterministically derived by the server from the exact immutable inputs.
        reason: { type: string, minLength: 1, maxLength: 1000 }
        createdByUserId: { type: string, minLength: 1, maxLength: 254 }
        createdAt: { type: string, format: date-time }
        requestId: { type: string, format: uuid }
        traceId: { type: string, minLength: 1, maxLength: 128 }
        versionKeyHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        snapshotHash: { type: string, pattern: "^[a-f0-9]{64}$", readOnly: true }
    ToolingEngineeringUnavailableField:
      type: object
      additionalProperties: false
      required: [state, reasonCode]
      properties:
        state: { type: string, const: unavailable }
        reasonCode:
          type: string
          enum: [erp_shot_count_unavailable, shot_count_calibration_policy_unavailable, erp_maintenance_projection_unavailable, tooling_health_policy_unavailable]
