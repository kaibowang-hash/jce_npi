        setProvenance: { $ref: "#/components/schemas/ToolingCapacityInputProvenance" }
    ToolingCapacityLineResult:
      type: object
      additionalProperties: false
      required: [globalId, partsPerDay, partsPerMonth, assemblyUnitsPerDay, assemblyUnitsPerMonth]
      properties:
        globalId: { type: string, format: uuid }
        partsPerDay: { type: string, pattern: "^[0-9]+[.][0-9]{6}$" }
        partsPerMonth: { type: string, pattern: "^[0-9]+[.][0-9]{6}$" }
        assemblyUnitsPerDay: { type: string, pattern: "^[0-9]+[.][0-9]{6}$" }
        assemblyUnitsPerMonth: { type: string, pattern: "^[0-9]+[.][0-9]{6}$" }
    ToolingCapacityScenarioResult:
      type: object
      additionalProperties: false
      description: >
        capacity.v1 computes parts_per_day as available_hours_per_day times
        3600 divided by cycle_seconds times oee_ratio times yield_ratio times
        cavity_count times effective_set_count; parts_per_month multiplies by
        working_days_per_month; assembly_units_per_day and
        assembly_units_per_month divide the matching part result by
        usage_per_assembly; scenario capacity is the minimum line assembly
        units per month and gap is the maximum of target minus scenario
        capacity and zero. Every output uses decimal-6-half-even.
      required: [formulaVersion, roundingRule, lineResults, scenarioAssemblyUnitsPerMonth, bottleneckLineGlobalIds, gap]
      properties:
        formulaVersion: { type: string, const: capacity.v1 }
        roundingRule: { type: string, const: decimal-6-half-even }
        lineResults:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ToolingCapacityLineResult" }
        scenarioAssemblyUnitsPerMonth: { type: string, pattern: "^[0-9]+[.][0-9]{6}$" }
        bottleneckLineGlobalIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        gap: { type: string, pattern: "^[0-9]+[.][0-9]{6}$" }
    ToolingCapacityScenarioRevision:
      type: object
      additionalProperties: false
      required: [schemaVersion, globalId, scenarioGlobalId, tenantId, projectGlobalId, toolingMasterGlobalId, scenarioVersion, predecessorGlobalId, predecessorSnapshotHash, title, effectiveFrom, targetMonthlyAssemblyUnits, formulaVersion, roundingRule, lines, result, reason, createdByUserId, createdAt, requestId, traceId, versionKeyHash, snapshotHash]
