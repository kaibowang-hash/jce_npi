components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sid
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes:
            npi.user: Use NPI One
            npi.admin: Administer NPI One
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      description: Immutable Engineering Project global_id; never a mutable business code
      schema: { type: string, format: uuid }
    TrialRoundId:
      in: path
      name: trialRoundId
      required: true
      description: Immutable Trial Round global_id within the already-authorized Project
      schema: { type: string, format: uuid }
    GateId:
      in: path
      name: gateId
      required: true
      schema: { type: string, format: uuid }
    ReviewCycleId:
      in: path
      name: cycleId
      required: true
      description: Immutable Gate Review Cycle global_id
      schema: { type: string, format: uuid }
    ReviewExceptionId:
      in: path
      name: exceptionId
      required: true
      description: Immutable Gate Review Exception global_id
      schema: { type: string, format: uuid }
    DocumentId:
      in: path
      name: documentId
      required: true
      description: Immutable Controlled Document global_id
      schema: { type: string, format: uuid }
    DocumentRevisionId:
      in: path
      name: revisionId
      required: true
      description: Immutable Document Revision global_id
      schema: { type: string, format: uuid }
    EngineeringBomId:
      in: path
      name: ebomId
      required: true
      description: Immutable NPI-owned Engineering BOM global_id
      schema: { type: string, format: uuid }
    EngineeringBomRevisionId:
      in: path
      name: revisionId
      required: true
      description: Immutable exact NPI-owned EBOM Revision global_id
      schema: { type: string, format: uuid }
    EngineeringBomPublishRequestId:
      in: path
      name: publishRequestId
      required: true
      description: Immutable operation-specific formal Item/MBOM publish-request global_id
      schema: { type: string, format: uuid }
    FileRevisionId:
      in: path
      name: fileRevisionId
      required: true
      description: Immutable exact private File Revision global_id
      schema: { type: string, format: uuid }
    ToolingId:
      in: path
      name: toolingId
      required: true
      schema: { type: string, format: uuid }
    TrialId:
      in: path
      name: trialId
      required: true
      schema: { type: string, format: uuid }
    ReadinessTemplateId:
      in: path
      name: templateId
      required: true
      description: Stable readiness-template global_id
      schema: { type: string, format: uuid }
    ReadinessTemplateVersionParam:
      in: path
      name: templateVersion
      required: true
      description: Exact positive readiness-template version
      schema: { type: integer, minimum: 1 }
    ReadinessInstanceId:
      in: path
      name: instanceId
      required: true
      description: Stable Project readiness-instance global_id within the already-authorized Project
      schema: { type: string, format: uuid }
    ProductionTransitionPolicyId:
      in: path
      name: policyId
      required: true
      description: Stable production-transition policy global_id
      schema: { type: string, format: uuid }
    ProductionTransitionPolicyVersionParam:
      in: path
      name: policyVersion
      required: true
      description: Exact positive production-transition policy version
      schema: { type: integer, minimum: 1 }
    ProductionHandoverId:
      in: path
      name: handoverId
      required: true
      description: Stable production-handover stream global_id within the already-authorized Project
      schema: { type: string, format: uuid }
    ProductionHandoverVersionParam:
      in: path
      name: handoverVersion
      required: true
      description: Exact positive handover package revision number
      schema: { type: integer, minimum: 1 }
    ObservationPeriodId:
      in: path
      name: observationId
      required: true
      description: Stable observation-period stream global_id within the already-authorized Project
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 255
        pattern: "^[!-~]{16,255}$"
    RequestId:
      in: header
      name: X-Request-ID
      required: true
      description: Caller-generated UUID used for request, audit, and support correlation
      schema: { type: string, format: uuid }
    CsrfToken:
      in: header
      name: X-Frappe-CSRF-Token
      required: true
      description: Current Frappe session CSRF token returned by SessionBootstrap
      schema: { type: string, minLength: 32, maxLength: 128 }
  responses:
    Error:
      description: Problem response for an otherwise undocumented error status
      headers:
        X-Trace-ID:
          description: Stable trace identifier matching ProblemDetails traceId
          schema:
            {
              type: string,
              minLength: 8,
              maxLength: 128,
              pattern: "^[A-Za-z0-9._:-]+$",
            }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    BadRequest:
      description: The request syntax, headers, or JSON representation is malformed
      headers:
        X-Request-ID:
          description: Request identifier echoed for audit and support correlation
          required: true
          schema: { type: string, format: uuid }
        X-Trace-ID:
          description: Stable trace identifier matching ProblemDetails traceId
          required: true
