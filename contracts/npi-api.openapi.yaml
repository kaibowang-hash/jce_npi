        tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
    MyWorkGridViewId:
      type: string
      enum: [all, today, overdue, approvals, blockers, waiting, integration]
    MyWorkGridColumnId:
      type: string
      enum: [type, item, context, assignment, priority, due, status, action]
    MyWorkGridWidths:
      type: object
      additionalProperties: false
      required: [type, item, context, assignment, priority, due, status, action]
      properties:
        type: { type: integer, minimum: 88, maximum: 180 }
        item: { type: integer, minimum: 180, maximum: 480 }
        context: { type: integer, minimum: 160, maximum: 420 }
        assignment: { type: integer, minimum: 140, maximum: 320 }
        priority: { type: integer, minimum: 96, maximum: 180 }
        due: { type: integer, minimum: 120, maximum: 220 }
        status: { type: integer, minimum: 112, maximum: 220 }
