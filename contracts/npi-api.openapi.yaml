        maximumNodes: { type: integer, minimum: 1, maximum: 500 }
        engineeringUoms:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 16 }
        attributeKeys:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
