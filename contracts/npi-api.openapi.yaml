    ProjectSubstitution:
      type: object
      additionalProperties: false
      required: [globalId, projectId, roleAssignmentId, substituteMemberId, effectiveFrom, effectiveTo, version]
      properties:
        globalId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        roleAssignmentId: { type: string, format: uuid }
        substituteMemberId: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        version: { type: integer, minimum: 1 }
    ProjectRaciAssignment:
      type: object
      additionalProperties: false
      description: A responsibility record only; it never grants ProjectAccess.APPROVE, Gate approval, or administration
      required: [globalId, projectId, contextType, contextId, responsibilityKey, roleAssignmentId, raci, version]
      properties:
        globalId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        contextType:
          { type: string, enum: [project, wbs_item, domain_work_item] }
        contextId: { type: string, format: uuid }
        responsibilityKey:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[a-z][a-z0-9_.-]*$",
          }
        roleAssignmentId: { type: string, format: uuid }
        raci:
          {
            type: string,
            enum: [responsible, accountable, consulted, informed],
          }
        version: { type: integer, minimum: 1 }
    ProjectWbsItemInput:
      type: object
      additionalProperties: false
      required: [globalId, code, title, plannedStart, plannedFinish, milestone, statusKey, progressPercent, critical]
      properties:
        globalId: { type: string, format: uuid }
        code:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$",
          }
        title: { type: string, minLength: 1, maxLength: 280 }
        parentId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        ownerRoleAssignmentId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        plannedStart: { type: string, format: date }
        plannedFinish: { type: string, format: date }
        actualStart:
          oneOf:
            - { type: string, format: date }
            - { type: "null" }
        actualFinish:
          oneOf:
            - { type: string, format: date }
            - { type: "null" }
        milestone: { type: boolean }
        statusKey:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[a-z][a-z0-9_.-]*$",
          }
        progressPercent:
          { type: integer, minimum: 0, maximum: 100 }
        critical:
          type: boolean
          description: Explicit critical-task indicator; it is not a computed critical-path claim
    ProjectDependencyInput:
      type: object
      additionalProperties: false
      description: Directed predecessor edge only; dependency type, lag, and external scheduling are not inferred
      required: [globalId, predecessorItemId, successorItemId]
      properties:
        globalId: { type: string, format: uuid }
        predecessorItemId: { type: string, format: uuid }
        successorItemId: { type: string, format: uuid }
    ApplyProjectWorkPlan:
      type: object
      additionalProperties: false
      description: >
        Atomic additive/upsert WBS command. The server validates the complete
        resulting parent and dependency graphs and rejects self references,
        missing or cross-Project references, duplicate edges, and cycles before
        any write. Omission never deletes an existing item or edge.
      required: [expectedProjectVersion, workPolicyRef, items, dependencies]
      properties:
        expectedProjectVersion: { type: integer, minimum: 1 }
        workPolicyRef:
          $ref: "#/components/schemas/ProjectWorkPolicyRef"
        items:
          type: array
          minItems: 1
          maxItems: 2000
          uniqueItems: true
          items: { $ref: "#/components/schemas/ProjectWbsItemInput" }
        dependencies:
          type: array
          maxItems: 5000
          uniqueItems: true
          items: { $ref: "#/components/schemas/ProjectDependencyInput" }
    ProjectWbsItem:
      type: object
      additionalProperties: false
      required: [globalId, projectId, code, title, plannedStart, plannedFinish, milestone, statusKey, statusLabelSource, progressPercent, critical, version]
      properties:
        globalId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        code:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$",
          }
        title: { type: string, minLength: 1, maxLength: 280 }
        parentId: { type: string, format: uuid }
        ownerRoleAssignmentId: { type: string, format: uuid }
        plannedStart: { type: string, format: date }
        plannedFinish: { type: string, format: date }
        actualStart: { type: string, format: date }
        actualFinish: { type: string, format: date }
        milestone: { type: boolean }
        statusKey:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[a-z][a-z0-9_.-]*$",
          }
        statusLabelSource:
          type: string
          enum: [Draft, Identified, Not started, Open, Requested]
          description: Literal English source string from the exact immutable Project Work Policy version
        progressPercent:
          { type: integer, minimum: 0, maximum: 100 }
        critical:
          type: boolean
          description: Explicit critical-task indicator; it is not a computed critical-path claim
        version: { type: integer, minimum: 1 }
    ProjectDependency:
      type: object
      additionalProperties: false
      required: [globalId, projectId, predecessorItemId, successorItemId, version]
      properties:
        globalId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        predecessorItemId: { type: string, format: uuid }
        successorItemId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
    CaptureProjectPlanBaseline:
      type: object
      additionalProperties: false
      required: [expectedProjectVersion, workPolicyRef, label]
      properties:
        expectedProjectVersion: { type: integer, minimum: 1 }
        workPolicyRef:
          $ref: "#/components/schemas/ProjectWorkPolicyRef"
        label: { type: string, minLength: 1, maxLength: 140 }
    ProjectPlanBaseline:
      type: object
      additionalProperties: false
      description: Immutable append-only snapshot of exact WBS planned dates and critical-task indicators
      required: [globalId, projectId, projectVersion, workPolicyRef, label, snapshotHash, capturedAt, capturedBy, version]
      properties:
        globalId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        projectVersion: { type: integer, minimum: 1 }
        workPolicyRef:
          $ref: "#/components/schemas/ProjectWorkPolicyRef"
        label: { type: string, minLength: 1, maxLength: 140 }
        snapshotHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        capturedAt: { type: string, format: date-time }
        capturedBy:
          type: string
          minLength: 1
          maxLength: 254
          description: Authenticated Frappe actor identity; Administrator is valid
        version: { type: integer, minimum: 1 }
    ProjectPlanBaselineComparisonItem:
      type: object
      additionalProperties: false
      required: [wbsItemId, baselinePlannedStart, baselinePlannedFinish, currentPlannedStart, currentPlannedFinish, startVarianceDays, finishVarianceDays, critical]
      properties:
        wbsItemId: { type: string, format: uuid }
        baselinePlannedStart: { type: string, format: date }
        baselinePlannedFinish: { type: string, format: date }
        currentPlannedStart: { type: string, format: date }
        currentPlannedFinish: { type: string, format: date }
        startVarianceDays: { type: integer }
        finishVarianceDays: { type: integer }
        critical: { type: boolean }
    ProjectPlanBaselineComparison:
      type: object
      additionalProperties: false
      required: [baselineId, baselineProjectVersion, currentProjectVersion, items]
      properties:
        baselineId: { type: string, format: uuid }
        baselineProjectVersion: { type: integer, minimum: 1 }
        currentProjectVersion: { type: integer, minimum: 1 }
        items:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/ProjectPlanBaselineComparisonItem"
    DomainWorkItemKind:
      type: string
      description: Persisted domain semantic kind; lifecycle rules remain kind-specific
      enum: [risk, issue, action, decision_request]
    CreateDomainWorkItemContext:
      type: object
      additionalProperties: false
      description: Optional context inside the Project from the authorized path; referenced objects must belong to that Project
      properties:
        stageId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        wbsItemId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
    DomainWorkItemContext:
      type: object
      additionalProperties: false
      required: [projectId]
      properties:
        projectId: { type: string, format: uuid }
        stageId: { type: string, format: uuid }
        wbsItemId: { type: string, format: uuid }
    CreateDomainWorkItem:
      type: object
      additionalProperties: false
      description: >
        Creates shared Domain WorkItem metadata. The server selects and
        validates the initial state from the matching risk, issue, action, or
        decision_request section of workPolicyRef. No stateKey is accepted from
        the caller and no common lifecycle is implied.
      required: [expectedProjectVersion, workPolicyRef, kind, title, context, ownerUserId, dueAt, severity, blocking, relatedWorkItemIds]
      properties:
        expectedProjectVersion: { type: integer, minimum: 1 }
        workPolicyRef:
          $ref: "#/components/schemas/ProjectWorkPolicyRef"
        kind:
          $ref: "#/components/schemas/DomainWorkItemKind"
        title: { type: string, minLength: 1, maxLength: 280 }
        detail:
          oneOf:
            - { type: string, maxLength: 4000 }
            - { type: "null" }
        context:
          $ref: "#/components/schemas/CreateDomainWorkItemContext"
        ownerUserId:
          { type: string, format: email, minLength: 3, maxLength: 254 }
        dueAt:
          {
            type: string,
            format: date-time,
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]{1,6})?Z$",
          }
        severity: { type: string, enum: [low, medium, high, critical] }
        blocking: { type: boolean }
        relatedWorkItemIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    DomainWorkItem:
      type: object
      additionalProperties: false
      description: >
        Persisted NPI domain object. stateKey is valid only within the matching
        kind-specific lifecycle section of workPolicyRef; it is not a My Work
        category, presentation status, or permission.
      required: [globalId, projectId, kind, title, context, ownerUserId, dueAt, severity, blocking, relatedWorkItemIds, workPolicyRef, stateKey, stateLabelSource, overdue, version, createdAt, lastChangedAt, source]
      properties:
        globalId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        kind:
          $ref: "#/components/schemas/DomainWorkItemKind"
        title: { type: string, minLength: 1, maxLength: 280 }
        detail: { type: string, maxLength: 4000 }
        context:
          $ref: "#/components/schemas/DomainWorkItemContext"
        ownerUserId:
          { type: string, format: email, minLength: 3, maxLength: 254 }
        dueAt:
          {
            type: string,
            format: date-time,
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]{1,6})?Z$",
          }
        severity: { type: string, enum: [low, medium, high, critical] }
        blocking: { type: boolean }
        relatedWorkItemIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        workPolicyRef:
          $ref: "#/components/schemas/ProjectWorkPolicyRef"
        stateKey:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[a-z][a-z0-9_.-]*$",
          }
        stateLabelSource:
          type: string
          enum: [Draft, Identified, Not started, Open, Requested]
          description: Literal English source string from the exact kind-specific lifecycle in workPolicyRef
        overdue:
          type: boolean
          description: Server-clock dueAt comparison for a state the exact kind-specific policy marks non-terminal
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        lastChangedAt: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/ProjectSourceStatus" }
    DomainWorkItemPage:
      type: object
      additionalProperties: false
      description: >
        Keyset-paginated page ordered by dueAt and globalId inside one
        authorized Project. A non-null nextCursor carries the fixed first-page
        asOf and query identity for stable overdue classification across the
        complete cursor chain.
      required: [projectId, projectVersion, items, nextCursor]
      properties:
        projectId: { type: string, format: uuid }
        projectVersion: { type: integer, minimum: 1 }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DomainWorkItem" }
        nextCursor:
          description: Opaque, Site-bound, HMAC-SHA256-signed v2 continuation token, or null when this cursor chain is exhausted
          oneOf:
            - {
                type: string,
                minLength: 1,
                maxLength: 500,
                pattern: "^[A-Za-z0-9._~:-]{1,500}$",
              }
            - { type: "null" }
    ProjectWorkContext:
      type: object
      additionalProperties: false
      description: Closed live Project work-management ViewModel; all arrays are empty before initialization
      required: [projectId, projectVersion, initialized, workPolicyRef, members, roleAssignments, substitutions, raciAssignments, wbsItems, dependencies, baselines, baselineComparison, permissions]
      properties:
        projectId: { type: string, format: uuid }
        projectVersion: { type: integer, minimum: 1 }
        initialized: { type: boolean }
        workPolicyRef:
          oneOf:
            - { $ref: "#/components/schemas/ProjectWorkPolicyRef" }
            - { type: "null" }
        members:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ProjectMember" }
        roleAssignments:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ProjectRoleAssignment" }
        substitutions:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ProjectSubstitution" }
        raciAssignments:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/ProjectRaciAssignment" }
        wbsItems:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/ProjectWbsItem" }
        dependencies:
          type: array
          maxItems: 5000
          items: { $ref: "#/components/schemas/ProjectDependency" }
        baselines:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ProjectPlanBaseline" }
        baselineComparison:
          oneOf:
            - { $ref: "#/components/schemas/ProjectPlanBaselineComparison" }
            - { type: "null" }
        permissions: { $ref: "#/components/schemas/ProjectPermissions" }
    ProjectControlPolicyReference:
      type: object
      additionalProperties: false
      required: [globalId, version, snapshotHash]
      properties:
        globalId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        snapshotHash:
          { type: string, pattern: "^[a-f0-9]{64}$", minLength: 64, maxLength: 64 }
    ProjectControlAuthority:
      type: object
      additionalProperties: false
      required: [slot, memberGlobalId, userId, displayName]
      properties:
        slot:
          { type: string, pattern: "^[a-z][a-z0-9_.-]{0,63}$", maxLength: 64 }
        memberGlobalId: { type: string, format: uuid }
        userId: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, minLength: 1, maxLength: 140 }
    ProjectHealthStatus:
      type: string
      enum: [unassessed, unavailable, green, yellow, red]
    ProjectHealthDimensionResult:
      type: object
      additionalProperties: false
      required: [dimension, ruleMode, status, numericValue]
      properties:
        dimension: { type: string, enum: [progress, cost, quality, risk] }
        ruleMode:
          {
            type: string,
            enum: [manual, higher_is_better, lower_is_better, unavailable],
          }
        status: { $ref: "#/components/schemas/ProjectHealthStatus" }
        numericValue:
          description: Canonical fixed-point value with at most 38 digits and 18 fractional digits
          oneOf:
            - { type: string, maxLength: 64, pattern: "^-?[0-9]+(?:\\.[0-9]+)?$" }
            - { type: "null" }
    ProjectHealthAssessmentSummary:
      type: object
      additionalProperties: false
      required: [globalId, assessedAt, actor, reason, recoveryPlan]
      properties:
        globalId: { type: string, format: uuid }
        assessedAt: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/ProjectControlAuthority" }
        reason:
          oneOf:
            - { type: string, minLength: 1, maxLength: 2000 }
            - { type: "null" }
        recoveryPlan:
          oneOf:
            - { type: string, minLength: 1, maxLength: 4000 }
            - { type: "null" }
    ProjectLifecyclePrerequisite:
      type: object
      additionalProperties: false
      required: [key, status]
      properties:
        key:
          {
            type: string,
            enum: [open_blockers, controlled_files, handover, cost],
          }
        status: { type: string, enum: [satisfied, blocked, unavailable] }
    ProjectLifecycleActionAvailability:
      type: object
      additionalProperties: false
      required:
        [action, available, targetState, authoritySlot, reasonCode, prerequisites]
      properties:
        action: { type: string, enum: [pause, cancel, resume, complete] }
        available: { type: boolean }
        targetState:
          { type: string, enum: [on_hold, cancelled, active, completed] }
        authoritySlot:
          oneOf:
            - { type: string, pattern: "^[a-z][a-z0-9_.-]{0,63}$" }
            - { type: "null" }
        reasonCode:
          {
            type: string,
            enum:
              [
                available,
                policy_missing,
                project_terminal,
                transition_not_defined,
                command_access_required,
                authority_required,
                prerequisite_unavailable,
                prerequisite_blocked,
              ],
          }
        prerequisites:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            { $ref: "#/components/schemas/ProjectLifecyclePrerequisite" }
    ProjectControls:
      type: object
      additionalProperties: false
      required:
        [
          project,
          policy,
          binding,
          health,
          lifecycleActions,
          bindingOptions,
          permissions,
        ]
      properties:
        project:
          type: object
          additionalProperties: false
          required: [globalId, businessCode, title, state, version, tenantId]
          properties:
            globalId: { type: string, format: uuid }
            businessCode: { type: string, minLength: 1, maxLength: 64 }
            title: { type: string, minLength: 1, maxLength: 140 }
            state:
              {
                type: string,
                enum: [draft, proposed, active, on_hold, completed, cancelled],
              }
            version: { type: integer, minimum: 1 }
            tenantId: { type: string, minLength: 1, maxLength: 128 }
        policy:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                [
                  globalId,
                  code,
                  version,
                  snapshotHash,
                  title,
                  healthAssessmentSlot,
                ]
              properties:
                globalId: { type: string, format: uuid }
                code: { type: string, minLength: 1, maxLength: 64 }
                version: { type: integer, minimum: 1 }
                snapshotHash:
                  { type: string, pattern: "^[a-f0-9]{64}$" }
                title: { type: string, minLength: 1, maxLength: 140 }
                healthAssessmentSlot:
                  { type: string, pattern: "^[a-z][a-z0-9_.-]{0,63}$" }
            - { type: "null" }
        binding:
          oneOf:
            - type: object
              additionalProperties: false
              required: [globalId, version, authorities]
              properties:
                globalId: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }
                authorities:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items:
                    { $ref: "#/components/schemas/ProjectControlAuthority" }
            - { type: "null" }
        health:
          type: object
          additionalProperties: false
          required: [overallStatus, dimensions, assessment]
          properties:
            overallStatus:
              { $ref: "#/components/schemas/ProjectHealthStatus" }
            dimensions:
              type: array
              minItems: 4
              maxItems: 4
              items:
                { $ref: "#/components/schemas/ProjectHealthDimensionResult" }
            assessment:
              oneOf:
                - { $ref: "#/components/schemas/ProjectHealthAssessmentSummary" }
                - { type: "null" }
        lifecycleActions:
          type: array
          minItems: 4
          maxItems: 4
          items:
            { $ref: "#/components/schemas/ProjectLifecycleActionAvailability" }
        bindingOptions:
          oneOf:
            - { $ref: "#/components/schemas/ProjectControlBindingOptions" }
            - { type: "null" }
        permissions:
          type: object
          additionalProperties: false
          required: [canBindPolicy, canAssessHealth, canTransition]
          properties:
            canBindPolicy: { type: boolean }
            canAssessHealth: { type: boolean }
            canTransition: { type: boolean }
    ProjectControlBindingOptions:
      type: object
      additionalProperties: false
      required: [policies, eligibleMembers]
      properties:
        policies:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [policyRef, code, title, authoritySlots]
            properties:
              policyRef:
                { $ref: "#/components/schemas/ProjectControlPolicyReference" }
              code: { type: string, minLength: 1, maxLength: 64 }
              title: { type: string, minLength: 1, maxLength: 140 }
              authoritySlots:
                type: array
                minItems: 1
                maxItems: 64
                uniqueItems: true
                items:
                  {
                    type: string,
                    pattern: "^[a-z][a-z0-9_.-]{0,63}$",
                  }
        eligibleMembers:
          type: array
          description: >
            Current enabled internal Project members who hold NPI API User
            transport admission and are either the Project owner or a current
            System Manager. The bind command revalidates every selection.
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [memberGlobalId, userId, displayName]
            properties:
              memberGlobalId: { type: string, format: uuid }
              userId:
                {
                  type: string,
                  format: email,
                  minLength: 3,
                  maxLength: 254,
                }
              displayName: { type: string, minLength: 1, maxLength: 140 }
    BindProjectControlPolicy:
      type: object
      additionalProperties: false
      required: [expectedProjectVersion, policyRef, bindings]
      properties:
        expectedProjectVersion: { type: integer, minimum: 1 }
        policyRef:
          { $ref: "#/components/schemas/ProjectControlPolicyReference" }
        bindings:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [slot, memberGlobalId]
            properties:
              slot:
                { type: string, pattern: "^[a-z][a-z0-9_.-]{0,63}$" }
              memberGlobalId: { type: string, format: uuid }
    ProjectHealthMeasurement:
      type: object
      additionalProperties: false
      required: [dimension, numericValue, manualStatus]
      properties:
        dimension: { type: string, enum: [progress, cost, quality, risk] }
        numericValue:
          description: Finite fixed-point value with at most 38 digits and 18 fractional digits
          oneOf:
            - { type: number, exclusiveMinimum: -1.0e38, exclusiveMaximum: 1.0e38 }
            - { type: string, maxLength: 64, pattern: "^-?[0-9]+(?:\\.[0-9]+)?$" }
            - { type: "null" }
        manualStatus:
          oneOf:
            - { type: string, enum: [green, yellow, red] }
            - { type: "null" }
    AssessProjectHealth:
      type: object
      additionalProperties: false
      required: [expectedProjectVersion, measurements, reason, recoveryPlan]
      properties:
        expectedProjectVersion: { type: integer, minimum: 1 }
        measurements:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/ProjectHealthMeasurement" }
        reason:
          oneOf:
            - { type: string, maxLength: 2000 }
            - { type: "null" }
        recoveryPlan:
          oneOf:
            - { type: string, maxLength: 4000 }
            - { type: "null" }
    TransitionProject:
      type: object
      additionalProperties: false
      required: [expectedProjectVersion, action, reason]
      properties:
        expectedProjectVersion: { type: integer, minimum: 1 }
        action: { type: string, enum: [pause, cancel, resume, complete] }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    ProjectMention:
      type: object
      additionalProperties: false
      required: [memberGlobalId, userId, displayName]
      properties:
        memberGlobalId: { type: string, format: uuid }
        userId: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, minLength: 1, maxLength: 140 }
    ProjectActivityAttachment:
      type: object
      additionalProperties: false
      required:
        [globalId, version, fileName, mimeType, sizeBytes, sha256, scanState]
      properties:
        globalId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        mimeType: { type: string, minLength: 1, maxLength: 255 }
        sizeBytes: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        scanState: { type: string, const: clean }
    ProjectObjectTarget:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, projectId]
          properties:
            kind: { type: string, const: project }
            projectId: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [kind, projectId, gateId]
          properties:
            kind: { type: string, const: gate }
            projectId: { type: string, format: uuid }
            gateId: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [kind, projectId, workItemId]
          properties:
            kind: { type: string, const: project_work_item }
            projectId: { type: string, format: uuid }
            workItemId: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [kind, projectId, learningId]
          properties:
            kind: { type: string, const: project_learning }
            projectId: { type: string, format: uuid }
            learningId: { type: string, format: uuid }
    ProjectObjectLink:
      type: object
      additionalProperties: false
      required: [type, globalId, version, code, title, target]
      properties:
        type:
          {
            type: string,
            enum: [project, gate, domain_work_item, file_revision, learning],
          }
        globalId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        code: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 280 }
        target: { $ref: "#/components/schemas/ProjectObjectTarget" }
    ProjectCommentDetail:
      type: object
      additionalProperties: false
      required: [body, mentions, attachments, objectLinks]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        mentions:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ProjectMention" }
        attachments:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ProjectActivityAttachment" }
        objectLinks:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ProjectObjectLink" }
    ProjectHealthEvaluation:
      type: object
      additionalProperties: false
      required:
        [policyRef, dimensionResults, overallStatus, reason, recoveryPlan]
      properties:
        policyRef:
          { $ref: "#/components/schemas/ProjectControlPolicyReference" }
        dimensionResults:
          type: array
          minItems: 4
          maxItems: 4
          items:
            { $ref: "#/components/schemas/ProjectHealthDimensionResult" }
        overallStatus: { $ref: "#/components/schemas/ProjectHealthStatus" }
        reason:
          oneOf:
            - { type: string, minLength: 1, maxLength: 2000 }
            - { type: "null" }
        recoveryPlan:
          oneOf:
            - { type: string, minLength: 1, maxLength: 4000 }
            - { type: "null" }
    ProjectHealthActivityDetail:
      type: object
      additionalProperties: false
      required: [assessment, policyRef, bindingGlobalId, projectVersion]
      properties:
        assessment:
          { $ref: "#/components/schemas/ProjectHealthEvaluation" }
        policyRef:
          { $ref: "#/components/schemas/ProjectControlPolicyReference" }
        bindingGlobalId: { type: string, format: uuid }
        projectVersion: { type: integer, minimum: 1 }
    ProjectLifecycleActivityDetail:
      type: object
      additionalProperties: false
      required:
        [
          action,
          fromState,
          toState,
          reason,
          approvedBy,
          policyRef,
          bindingGlobalId,
          prerequisites,
          projectVersion,
        ]
      properties:
        action: { type: string, enum: [pause, cancel, resume, complete] }
        fromState:
          {
            type: string,
            enum: [draft, proposed, active, on_hold, completed, cancelled],
          }
        toState:
          {
            type: string,
            enum: [draft, proposed, active, on_hold, completed, cancelled],
          }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        approvedBy:
          { $ref: "#/components/schemas/ProjectControlAuthority" }
        policyRef:
          { $ref: "#/components/schemas/ProjectControlPolicyReference" }
        bindingGlobalId: { type: string, format: uuid }
        prerequisites:
          type: array
          maxItems: 4
          items:
            { $ref: "#/components/schemas/ProjectLifecyclePrerequisite" }
        projectVersion: { type: integer, minimum: 1 }
    ProjectActivityItem:
      type: object
      additionalProperties: false
      required: [globalId, eventType, actorUserId, occurredAt, detail]
      properties:
        globalId: { type: string, format: uuid }
        eventType:
          {
            type: string,
            enum:
              [
                comment_added,
                followed,
                unfollowed,
                health_assessed,
                lifecycle_transition,
                learning_created,
              ],
          }
        actorUserId:
          type: string
          minLength: 1
          maxLength: 254
          description: Authenticated Frappe actor identity; Administrator is valid
        occurredAt: { type: string, format: date-time }
        detail:
          oneOf:
            - { $ref: "#/components/schemas/ProjectCommentDetail" }
            - type: object
              additionalProperties: false
              required: [active]
              properties: { active: { type: boolean } }
            - { $ref: "#/components/schemas/ProjectHealthActivityDetail" }
            - { $ref: "#/components/schemas/ProjectLifecycleActivityDetail" }
            - type: object
              additionalProperties: false
              required: [learningGlobalId, kind, title]
              properties:
                learningGlobalId: { type: string, format: uuid }
                kind: { $ref: "#/components/schemas/ProjectLearningKind" }
                title: { type: string, minLength: 1, maxLength: 280 }
    ProjectActivityPage:
      type: object
      additionalProperties: false
      description: >
        Immutable Project activity ordered by occurredAt descending and globalId
        descending. A non-null nextCursor continues the fixed first-page asOf
        chain without binding the requested limit.
      required:
        [projectId, items, nextCursor, permissions, commentOptions, following, followerVersion]
      properties:
        projectId: { type: string, format: uuid }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ProjectActivityItem" }
        nextCursor:
          description: Opaque, Site-bound, actor-bound, HMAC-SHA256-signed v1 continuation token, or null when this cursor chain is exhausted
          oneOf:
            - {
                type: string,
                minLength: 1,
                maxLength: 500,
                pattern: "^[A-Za-z0-9._~:-]{1,500}$",
              }
            - { type: "null" }
        permissions:
          type: object
          additionalProperties: false
          required: [canComment, canFollow]
          properties:
            canComment: { type: boolean }
            canFollow: { type: boolean }
        commentOptions:
          { $ref: "#/components/schemas/ProjectCommentOptions" }
        following: { type: boolean }
        followerVersion: { type: integer, minimum: 0 }
    ProjectCommentOptions:
      type: object
      additionalProperties: false
      required: [truncated, mentions, attachments, objectLinks]
      properties:
        truncated:
          type: boolean
          description: True when one or more server-resolved choice sets were bounded
        mentions:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ProjectMention" }
        attachments:
          type: array
          maxItems: 500
          items:
            { $ref: "#/components/schemas/ProjectActivityAttachment" }
        objectLinks:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ProjectObjectLink" }
    AddProjectComment:
      type: object
      additionalProperties: false
      required: [body, mentions, attachments, objectLinks]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        mentions:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [memberGlobalId]
            properties:
              memberGlobalId: { type: string, format: uuid }
        attachments:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [globalId, version]
            properties:
              globalId: { type: string, format: uuid }
              version: { type: integer, minimum: 1 }
        objectLinks:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [type, globalId, version]
            properties:
              type:
                {
                  type: string,
                  enum:
                    [project, gate, domain_work_item, file_revision, learning],
                }
              globalId: { type: string, format: uuid }
              version: { type: integer, minimum: 1 }
    ChangeProjectFollowState:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
    ProjectFollowState:
      type: object
      additionalProperties: false
      required: [projectId, following, version, changedAt]
      properties:
        projectId: { type: string, format: uuid }
        following: { type: boolean }
        version: { type: integer, minimum: 1 }
        changedAt: { type: string, format: date-time }
    ProjectLearningKind:
      type: string
