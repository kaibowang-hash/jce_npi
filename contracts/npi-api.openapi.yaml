              approved,
              released,
              superseded,
              obsolete,
            ]
        fromState:
          type: string
          enum: [draft, in_review, approved, released, superseded, obsolete]
        toState:
          type: string
          enum: [draft, in_review, approved, released, superseded, obsolete]
        fromVersion: { type: integer, minimum: 0 }
        toVersion: { type: integer, minimum: 1 }
        cycleId: { type: string, format: uuid }
        confirmationHashes:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
