          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/GateReviewSelectedStep"
        exceptions:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/GateReviewException"
