  schemas:
    ControlledPrintSourceReference:
      type: object
      additionalProperties: false
      required:
        [sourceKind, sourceGlobalId, sourceVersion, sourceState, sourceSnapshotHash]
      properties:
        sourceKind:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
          description: Stable server-owned adapter key; never a raw Frappe DocType
        sourceGlobalId: { type: string, format: uuid }
        sourceVersion: { type: integer, minimum: 1 }
        sourceState:
          { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]*$" }
        sourceSnapshotHash: { type: string, pattern: "^[a-f0-9]{64}$" }
    ControlledPrintRegistryReference:
      type: object
      additionalProperties: false
      description: Public hash reference only; Print Format name and template remain server-side
      required:
        [globalId, registryGlobalId, version, snapshotHash, templateSha256]
      properties:
        globalId: { type: string, format: uuid }
        registryGlobalId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        snapshotHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        templateSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    ControlledPrintPermissions:
      type: object
      additionalProperties: false
      required: [create, download]
      properties:
        create: { type: boolean }
        download: { type: boolean }
    ControlledPrintCapability:
      type: object
      additionalProperties: false
      required: [available, sourceKind, sourceGlobalId, sourceVersion, language, permissions]
      properties:
        available: { type: boolean }
        sourceKind:
          { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]*$" }
        sourceGlobalId: { type: string, format: uuid }
        sourceVersion: { type: integer, minimum: 1 }
        language: { type: string, enum: [en, zh, zh-TW] }
        deliveryMode:
          description: Present only for one exact approved mapping
          oneOf:
            - { type: string, const: controlled_pdf }
            - { type: "null" }
        copyState:
          description: Structural non-numbered foundation; no copy policy is claimed
          oneOf:
            - { type: string, const: not_numbered }
            - { type: "null" }
        registry:
          oneOf:
            - { $ref: "#/components/schemas/ControlledPrintRegistryReference" }
            - { type: "null" }
        permissions: { $ref: "#/components/schemas/ControlledPrintPermissions" }
    CreateControlledPrintSnapshot:
      type: object
      additionalProperties: false
      required: [sourceKind, sourceGlobalId, sourceVersion, language]
      properties:
        sourceKind:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
          description: Stable server-owned adapter key; never a raw Frappe DocType
        sourceGlobalId: { type: string, format: uuid }
        sourceVersion: { type: integer, minimum: 1 }
        language: { type: string, enum: [en, zh, zh-TW] }
    ControlledPrintOutput:
      type: object
      additionalProperties: false
      description: URL-free exact private output metadata
      required: [globalId, fileName, mimeType, sizeBytes, sha256, recordHash]
      properties:
        globalId: { type: string, format: uuid }
        fileName: { type: string, minLength: 5, maxLength: 140, pattern: "^[^/\\]+[.]pdf$" }
        mimeType: { type: string, const: application/pdf }
        sizeBytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        recordHash: { type: string, pattern: "^[a-f0-9]{64}$" }
    ControlledPrintSnapshot:
      type: object
      additionalProperties: false
      required:
        [globalId, version, source, registry, language, deliveryMode, copyState,
         watermarkSource, actorUserId, printedAt, snapshotHash,
         verificationPayload, output]
      properties:
        globalId: { type: string, format: uuid }
        version: { type: integer, const: 1 }
        source: { $ref: "#/components/schemas/ControlledPrintSourceReference" }
        registry: { $ref: "#/components/schemas/ControlledPrintRegistryReference" }
        language: { type: string, enum: [en, zh, zh-TW] }
        deliveryMode: { type: string, const: controlled_pdf }
        copyState: { type: string, const: not_numbered }
        watermarkSource: { type: string, minLength: 1, maxLength: 140 }
        actorUserId: { type: string, minLength: 1, maxLength: 254 }
        printedAt: { type: string, format: date-time }
        snapshotHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        verificationPayload:
          { type: string, minLength: 1, maxLength: 256, pattern: "^urn:npi:controlled-print:[0-9a-f-]+:[a-f0-9]{64}$" }
        output: { $ref: "#/components/schemas/ControlledPrintOutput" }
    LanguageCode:
      type: string
      enum: [en, zh, zh-TW]
    TranslationCatalog:
      type: object
      additionalProperties: false
      required: [language, version, messages]
      properties:
        language:
          $ref: "#/components/schemas/LanguageCode"
        version:
          type: string
          pattern: "^[a-f0-9]{64}$"
        messages:
          type: object
          description: Effective Frappe translations filtered to canonical NPI source/context keys
          additionalProperties:
            type: string
    SessionBootstrap:
      type: object
      additionalProperties: false
      required: [userId, language, allowedLanguages, csrfToken, catalog, preferences]
      properties:
        userId: { type: string }
        language:
          $ref: "#/components/schemas/LanguageCode"
        allowedLanguages:
          type: array
          minItems: 3
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/LanguageCode"
        csrfToken:
          type: string
          minLength: 32
          maxLength: 128
          description: Current token for X-Frappe-CSRF-Token on unsafe session requests
        catalog:
          $ref: "#/components/schemas/TranslationCatalog"
        preferences:
          $ref: "#/components/schemas/SessionPreferences"
    SessionPreferences:
      type: object
      additionalProperties: false
      required: [navigationCollapsed]
      properties:
        navigationCollapsed:
          type: boolean
          description: Authenticated user's explicit full or icon-only choice; responsive presentation changes are not persisted here
    SetSessionLanguage:
      type: object
      additionalProperties: false
      required: [language]
      properties:
        language:
          $ref: "#/components/schemas/LanguageCode"
    SetSessionNavigationPreference:
      type: object
      additionalProperties: false
      required: [collapsed]
      properties:
        collapsed:
          type: boolean
    SourceStatus:
      type: object
      additionalProperties: false
      required: [sourceSystem, editableIn, syncState]
      properties:
        sourceSystem: { type: string, enum: [NPI_ONE, ERPNEXT, COMPUTED] }
        editableIn: { type: string, enum: [NPI_ONE, ERPNEXT, NONE] }
        syncState:
          type: string
          enum:
            [
              local,
              pending,
              processing,
              synced,
              partial,
              failed_retryable,
              failed_final,
              stale,
              conflict,
            ]
        externalUrl: { type: string, format: uri }
        lastSyncedAt: { type: string, format: date-time }
    ProjectType:
      type: string
      description: Controlled Project classification; it must equal the selected published template version's Project type
      enum: [customer_owned_tool, new_tool, tool_change]
    ProjectTemplateReference:
      type: object
      additionalProperties: false
      description: Exact immutable published template snapshot recorded by the Project
      required: [globalId, code, version, snapshotHash]
      properties:
        globalId:
          type: string
          format: uuid
          description: Immutable identity of the versioned Project Template aggregate
        code:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$",
          }
        version: { type: integer, minimum: 1 }
        snapshotHash: { type: string, pattern: "^[a-f0-9]{64}$" }
    ProjectObjectReference:
      type: object
      additionalProperties: false
      description: >
        Explicit typed reference validated against the selected template's
        required-reference policy. sourceSystem and source identifiers state
        provenance without transferring field ownership to NPI One.
      required: [type, sourceSystem, sourceObjectId]
      properties:
        globalId: { type: string, format: uuid }
        type:
          type: string
          enum: [customer, product, part, tooling, order]
        sourceSystem: { type: string, enum: [NPI_ONE, ERPNEXT] }
        sourceObjectId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]*$"
    CreateProjectDraft:
      type: object
      additionalProperties: false
      description: >
        Strict command payload. templateGlobalId and templateVersion must identify
        an immutable published version, expectedVersion must match its current
        optimistic version, projectType must be supported by it, businessCode
        must be unique in its tenant, and references must satisfy that version's
        explicit reference policy before any Project or Gate record is committed.
      required:
        [
          tenantId,
          businessCode,
          title,
          projectType,
          ownerUserId,
          targetSop,
          templateGlobalId,
          templateVersion,
          expectedVersion,
          references,
        ]
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]*$"
        businessCode:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
          description: Explicit human-readable code; never the cross-system identity
        title: { type: string, minLength: 1, maxLength: 140 }
        projectType: { $ref: "#/components/schemas/ProjectType" }
        ownerUserId:
          { type: string, format: email, minLength: 3, maxLength: 254 }
        targetSop: { type: string, format: date }
        templateGlobalId: { type: string, format: uuid }
        templateVersion: { type: integer, minimum: 1 }
        expectedVersion: { type: integer, minimum: 1 }
        references:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/ProjectObjectReference" }
    ProjectCockpitProject:
      type: object
      additionalProperties: false
      required:
        [
          globalId,
          businessCode,
          title,
          projectType,
          state,
          version,
          tenantId,
          ownerUserId,
          targetSop,
          createdAt,
          lastChangedAt,
          lastChangedBy,
          source,
        ]
      properties:
        globalId:
          type: string
          format: uuid
          description: Immutable Project identity used by routes and cross-system references
        businessCode:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$",
          }
        title: { type: string, minLength: 1, maxLength: 140 }
        projectType: { $ref: "#/components/schemas/ProjectType" }
        state: { type: string, enum: [draft] }
        version: { type: integer, minimum: 1 }
        tenantId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]*$"
        ownerUserId:
          { type: string, format: email, minLength: 3, maxLength: 254 }
        targetSop: { type: string, format: date }
