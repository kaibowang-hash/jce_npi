    GateReviewCycle:
      type: object
      additionalProperties: false
      required: [globalId, number, trigger, state, version, policyRef, policyDefinition, inputHash, bindings, selectedSteps, exceptions, startedAt, startedBy]
      properties:
        globalId: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        trigger:
          {
            type: string,
            enum: [manual_start, manual_reopen, dependency_change],
          }
        state:
          {
            type: string,
            enum: [active, decided, invalidated, superseded],
          }
        version: { type: integer, minimum: 1 }
