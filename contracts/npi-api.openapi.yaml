  /projects/{projectId}/activity:
    get:
      tags: [Projects]
      operationId: getProjectActivity
      description: >
        Lists immutable Project activity inside one already-authorized Project,
        ordered by occurredAt descending and globalId descending. The first page
        fixes a server-clock asOf instant, and subsequent pages use a strict
        occurredAt/globalId keyset seek so later appends neither displace nor
        duplicate records in that cursor chain. The opaque v1 cursor binds the
        tenant, normalized actor identity, and projectId through a SHA-256 query
        fingerprint; limit is intentionally excluded. A domain-separated
        HMAC-SHA256 key derived from the current Site's persistent Frappe
        encryption key signs the complete canonical cursor payload. Cursor
        validation occurs only after Project authorization. A malformed,
        other-version, query-mismatched, or signature-invalid cursor returns
        the 422 cursor validation representation without querying activity.
        A missing or invalid Site encryption key fails closed with the 503
        service-unavailable representation.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
        - in: query
          name: cursor
          description: >
            Opaque, Site-bound, actor-bound, HMAC-SHA256-signed v1 keyset
            cursor returned by the preceding page. Replay it for the same
            authorized Project; limit may change.
          schema:
            {
              type: string,
              minLength: 1,
              maxLength: 500,
              pattern: "^[A-Za-z0-9._~:-]{1,500}$",
            }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          $ref: "#/components/responses/ProjectActivityQueryResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/PermissionError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "422": { $ref: "#/components/responses/ProjectValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/ProjectError" }

