components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sid
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes:
            npi.user: Use NPI One
            npi.admin: Administer NPI One
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      description: Immutable Engineering Project global_id; never a mutable business code
      schema: { type: string, format: uuid }
    GateId:
      in: path
      name: gateId
      required: true
      schema: { type: string, format: uuid }
    ReviewCycleId:
      in: path
      name: cycleId
      required: true
      description: Immutable Gate Review Cycle global_id
      schema: { type: string, format: uuid }
    ReviewExceptionId:
      in: path
      name: exceptionId
      required: true
      description: Immutable Gate Review Exception global_id
      schema: { type: string, format: uuid }
    DocumentId:
      in: path
      name: documentId
      required: true
      description: Immutable Controlled Document global_id
      schema: { type: string, format: uuid }
    DocumentRevisionId:
      in: path
      name: revisionId
      required: true
      description: Immutable Document Revision global_id
      schema: { type: string, format: uuid }
    EngineeringBomId:
      in: path
      name: ebomId
      required: true
      description: Immutable NPI-owned Engineering BOM global_id
      schema: { type: string, format: uuid }
    EngineeringBomRevisionId:
      in: path
