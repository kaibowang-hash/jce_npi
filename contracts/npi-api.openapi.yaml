          minItems: 1
          maxItems: 2000
          uniqueItems: true
          items: { $ref: "#/components/schemas/ProjectWbsItemInput" }
        dependencies:
          type: array
          maxItems: 5000
          uniqueItems: true
          items: { $ref: "#/components/schemas/ProjectDependencyInput" }
    ProjectWbsItem:
      type: object
