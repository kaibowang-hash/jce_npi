        version: { type: integer, minimum: 1 }
        currentCycleGlobalId:
          anyOf:
            - { type: string, format: uuid }
            - type: "null"
        latestDecisionGlobalId:
          anyOf:
            - { type: string, format: uuid }
            - type: "null"
        latestDecisionHash:
          anyOf:
            - { type: string, pattern: "^[a-f0-9]{64}$" }
            - type: "null"
