        terminal: { type: boolean }
    GateReviewInputDependency:
      type: object
      additionalProperties: false
      required: [kind, globalId, version, snapshotHash]
      properties:
        kind: { type: string, const: gate_input_snapshot }
        globalId:
          $ref: "#/components/schemas/CanonicalUuid"
