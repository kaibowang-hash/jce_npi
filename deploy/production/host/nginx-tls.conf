map $http_upgrade $launchflow_connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name launchflow.whjichen.cn;
  server_tokens off;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name launchflow.whjichen.cn;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/launchflow.whjichen.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/launchflow.whjichen.cn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:LaunchFlowTLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 50m;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /healthz {
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:8080;
    access_log off;
  }

  location ~ ^/(?:api(?:/|$)|socket[.]io(?:/|$)|assets/(?:frappe|npi_core|npi_integration)(?:/|$)|files(?:/|$)|private(?:/|$)|protected(?:/|$)|login(?:/|$)|logout(?:/|$)|app(?:/|$)|desk(?:/|$)|printview(?:/|$)) {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $launchflow_connection_upgrade;
    proxy_cookie_flags ~ secure httponly samesite=lax;
    proxy_pass http://127.0.0.1:8081;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://127.0.0.1:8080;
  }
}
